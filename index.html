<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#f2f4f7; --surface:#ffffff; --ink:#14213d; --ink2:#55627a; --line:#d8dee8;
  --brand:#0d5c63; --brand-ink:#ffffff; --mark:#ffe58a;
  --warn:#8a5200; --warn-bg:#fff1d6; --ok:#0b6b45; --ok-bg:#d9f2e6; --bad:#a32a2a; --bad-bg:#fde3e1;
  --backdrop:rgba(20,33,61,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f141d; --surface:#171e2b; --ink:#e8edf5; --ink2:#9aa7bd; --line:#2a3446;
    --brand:#4fb7bd; --brand-ink:#06232a; --mark:#6b5a12;
    --warn:#f1c36b; --warn-bg:#3a2d0f; --ok:#6fd6a4; --ok-bg:#12372a; --bad:#ff9b94; --bad-bg:#431a19;
    --backdrop:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0f141d; --surface:#171e2b; --ink:#e8edf5; --ink2:#9aa7bd; --line:#2a3446;
  --brand:#4fb7bd; --brand-ink:#06232a; --mark:#6b5a12;
  --warn:#f1c36b; --warn-bg:#3a2d0f; --ok:#6fd6a4; --ok-bg:#12372a; --bad:#ff9b94; --bad-bg:#431a19;
  --backdrop:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
/* Identitat corporativa Joan Nogue */
:root{--brand:#0b5961;--brand-dark:#083d43;--brand-soft:#e9f4f4;--ink:#10243a;--ink2:#617083}
.top{box-shadow:0 2px 16px rgba(16,36,58,.05)}
.top-in{min-height:72px;padding:12px 20px}
.brand-wrap{display:flex;align-items:center;gap:12px;min-width:240px}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,var(--brand),var(--brand-dark));color:#fff;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;letter-spacing:.04em;box-shadow:0 7px 16px rgba(11,89,97,.18)}
.brand-copy{display:flex;flex-direction:column;gap:1px}
.brand-main{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.08rem;line-height:1.1}
.brand-sub{font-size:.74rem;color:var(--ink2);letter-spacing:.02em}
.who{gap:10px}
.who-name{display:flex;flex-direction:column;gap:0;line-height:1.15}
.who-name strong{font-size:.92rem;color:var(--ink)}
.who-name span{font-size:.74rem;color:var(--ink2)}
.role-chip{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-dark);font-size:.72rem;font-weight:700}
.login{position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(16,36,58,.07)}
.login::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--brand-dark),var(--brand),#75b6b9)}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:700;color:var(--brand);margin-bottom:8px}
.login h1{max-width:12ch}
.hero{box-shadow:0 14px 34px rgba(16,36,58,.045)}
.hero .corporate-label{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-dark);font-size:.75rem;font-weight:700;margin-bottom:10px}
.mode-card{box-shadow:0 8px 20px rgba(16,36,58,.035)}
.mode-card.primary-mode{border-color:rgba(11,89,97,.26);background:linear-gradient(180deg,#f9ffff,#fff)}
.section-head{margin-top:34px}
.manager-welcome{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(135deg,#0b5961,#083d43);color:#fff;border-radius:16px;padding:18px 20px;margin:0 0 18px;box-shadow:0 14px 34px rgba(11,89,97,.16)}
.manager-welcome .eyebrow{color:#bfe1e3;margin-bottom:3px}
.manager-welcome h2{font-size:1.25rem}
.manager-welcome p{margin:4px 0 0;color:#d8ecee;font-size:.9rem}
.manager-badge{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);font-weight:700;letter-spacing:.04em}
.footer-brand{max-width:1120px;margin:8px auto 0;padding:0 16px 26px;color:var(--ink2);font-size:.76rem}
.footer-contact{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;opacity:.92}
.footer-contact strong{color:var(--ink);font-weight:600}
.footer-contact span{color:var(--ink2)}
.footer-contact a{color:var(--ink2);text-decoration:none}
.footer-contact a:hover{color:var(--brand);text-decoration:underline}

@media (max-width:760px){
  .bulk-summary{grid-template-columns:1fr 1fr}
  .bulk-stat strong{font-size:1.2rem}
}

@media (max-width:760px){.brand-sub{display:none}.top-in{padding:10px 14px}.who-name{display:none}.role-chip{display:none}.manager-welcome{align-items:flex-start}}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;letter-spacing:-.015em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.15rem}
.brand svg{width:24px;height:24px;color:var(--brand)}
.tabs{display:flex;gap:4px;background:var(--paper);padding:3px;border-radius:11px;border:1px solid var(--line)}
.tabs[hidden]{display:none !important}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink2)}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs[hidden]{display:none !important}

.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang-switch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 8px;color:var(--ink2)}
.lang-globe{font-size:.95rem;line-height:1}
.lang-switch select{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer;padding:4px 2px;outline:none}
.lang-switch select:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.who{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--ink2)}
.who b{color:var(--ink);font-weight:600}
.who .btn{min-height:36px;padding:6px 12px}
.login{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;max-width:920px;margin:18px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px}
.login h1{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.1;font-weight:700;margin-bottom:10px}
.login p{color:var(--ink2);margin:0 0 16px}
.login .receipt{max-width:150px;margin:8px 0 0}
.login .fields{grid-template-columns:1fr}
.fname{color:var(--ink2);font-size:.88rem;margin:8px 0 0;overflow-wrap:anywhere}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 72px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.row-actions{display:flex;flex-wrap:wrap;gap:10px}

.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px}
.hero h1{font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.08;font-weight:700;margin-bottom:10px}
.hero p{margin:0 0 20px;color:var(--ink2);max-width:46ch}
.hero.drag{border-color:var(--brand);box-shadow:0 0 0 3px var(--mark)}
.receipt{width:100%;max-width:220px;justify-self:center;color:var(--ink)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:.95rem}
.notice.bad{background:var(--bad-bg);color:var(--bad)}

.work{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.imgwrap{position:relative;border-radius:12px;overflow:hidden;background:var(--paper);border:1px solid var(--line);min-height:120px;display:grid;place-items:center;color:var(--ink2)}
.imgwrap img{display:block;width:100%;max-height:72vh;object-fit:contain}
.scan{position:absolute;left:0;right:0;top:0;height:3px;background:var(--brand);box-shadow:0 0 22px 8px var(--mark);animation:sweep 1.7s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 3px)}}
.work h2{font-size:1.35rem;margin-bottom:4px}
.sub{color:var(--ink2);margin:0 0 14px;font-size:.95rem}
.skeleton{display:grid;gap:12px;margin:18px 0}
.skeleton i{display:block;height:44px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.skeleton i:nth-child(odd){width:100%}.skeleton i:nth-child(even){width:70%}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:block}
.field.wide{grid-column:1/-1}
.field>span{display:block;font-size:.82rem;font-weight:500;color:var(--ink2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background-color:var(--surface);min-height:44px}
.field textarea{min-height:76px;resize:vertical}
.field input[readonly],.field select[disabled]{background-color:var(--paper)}
.field.ai input{background-image:linear-gradient(to top,var(--mark) 0 40%,transparent 40%);background-repeat:no-repeat;background-size:100% 100%}
.field.miss input{border-color:var(--warn);background-color:var(--warn-bg)}
.field.miss em{font-style:normal;color:var(--warn);font-size:.78rem}
.fresh .field{animation:rise .4s ease-out both;animation-delay:calc(var(--i)*70ms)}
.fresh .field.ai input{animation:mark .7s ease-out both;animation-delay:calc(var(--i)*70ms + 200ms)}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
@keyframes mark{from{background-size:0% 100%}}
.err{color:var(--bad);margin:10px 0 0;min-height:1.4em;font-size:.95rem}
.warn-sum{color:var(--warn);font-size:.9rem;margin:10px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.section-head h2{font-size:1.4rem}
.section-head span{color:var(--ink2);font-size:.95rem}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;background:transparent;border:0;padding:14px 16px;cursor:pointer}
.item:hover{background:var(--paper)}
.item b{display:block;font-weight:600}
.item small{color:var(--ink2);font-size:.88rem}
.item .amt{text-align:right;white-space:nowrap}
.item .amt strong{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.15rem;font-variant-numeric:tabular-nums}
.empty{padding:28px 18px;color:var(--ink2);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px}
.chip.pendiente{background:var(--warn-bg);color:var(--warn)}
.chip.revisada{background:var(--ok-bg);color:var(--ok)}
.chip.invoice-type{margin-left:6px}.chip.invoice-type.recibida{background:#eaf1ff;color:#274d8a}.chip.invoice-type.emitida{background:#eee8ff;color:#5b3aa6}


.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.type-required-select select:invalid{border-color:var(--warn)}
.mode-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.mode-card:hover{transform:translateY(-1px);border-color:var(--brand);box-shadow:0 8px 20px rgba(20,33,61,.08)}
.mode-card h3{font-size:1.1rem;margin:0 0 6px}
.mode-card p{margin:0;color:var(--ink2);font-size:.92rem}
.mode-card .mode-action{margin-top:12px}
@media (max-width:760px){.mode-grid{grid-template-columns:1fr}}
.history-filters{margin-top:10px;margin-bottom:16px}.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.filters .field{min-width:150px;flex:1 1 150px}
.filters .field.grow{flex:2 1 220px}
.summary{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;margin:16px 2px}
.summary div{font-size:.9rem;color:var(--ink2)}
.summary strong{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.4rem;color:var(--ink);font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin:20px 0 4px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:980px}
th{text-align:left;font-weight:600;font-size:.84rem;color:var(--ink2);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--paper)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small{display:block;color:var(--ink2)}


.expense-card{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px}
.expense-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.expense-head h3{font-size:1.05rem}
.expense-head p{margin:3px 0 0;color:var(--ink2);font-size:.88rem}
.expense-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.expense-row{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px;align-items:center}
.expense-row label{font-size:.83rem;color:var(--ink2)}
.expense-row input{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:right}
.expense-total{display:flex;justify-content:flex-end;align-items:center;gap:12px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-weight:600}
.expense-total strong{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.12rem}
.pnl{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.pnl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pnl-head h2{font-size:1.35rem}
.pnl-head p{margin:3px 0 0;color:var(--ink2);font-size:.9rem}
.pnl-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pnl-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.pnl-card span{display:block;color:var(--ink2);font-size:.83rem}
.pnl-card strong{display:block;margin-top:3px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.35rem}
.pnl-card.result strong{color:var(--ok)}
.pnl-card.result.negative strong{color:var(--bad)}
.pnl-meta{margin-top:10px;color:var(--ink2);font-size:.8rem}
.pnl-table{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:auto}
.pnl-table table{min-width:720px}
@media (max-width:760px){
  .expense-grid{grid-template-columns:1fr}
  .expense-row{grid-template-columns:minmax(0,1fr) 112px}
  .pnl-cards{grid-template-columns:1fr}
}

dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(980px,calc(100vw - 20px));max-height:calc(100vh - 20px);overflow:auto}
dialog::backdrop{background:var(--backdrop)}
.dpad{padding:20px}
.dhead{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:14px}
.dhead h2{font-size:1.4rem}
.dgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px}
.meta{color:var(--ink2);font-size:.88rem;margin:14px 0 0}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:12px;max-width:min(92vw,520px);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#toast.bad{background:var(--bad);color:#fff}

@media (max-width:760px){
  .login{grid-template-columns:1fr;padding:22px}
  .hero{grid-template-columns:1fr;padding:22px}
  .receipt{display:none}
  .work,.dgrid{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){.fields{grid-template-columns:1fr}}

/* ---------- Responsive mobile ---------- */
@media (max-width:900px){
  .top-in{padding:10px 14px}
  .wrap{padding:16px 14px 56px}
  .login{max-width:100%;gap:22px;padding:24px}
  .hero{padding:24px}
  .work{gap:16px;padding:16px}
  .dgrid{gap:16px}
}

@media (max-width:760px){
  .top-in{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:
      "brand actions"
      "tabs tabs";
    align-items:center;
    gap:8px 10px;
    min-height:auto;
  }
  .brand-wrap{grid-area:brand;min-width:0;gap:9px}
  .brand-mark{width:38px;height:38px;border-radius:10px;font-size:.9rem}
  .brand-main{font-size:1rem}
  .brand-sub{display:none}
  .header-actions{grid-area:actions;min-width:0;justify-content:flex-end;gap:7px}
  .tabs{grid-area:tabs;width:100%;overflow-x:auto;justify-content:stretch}
  .tab{flex:1 0 auto;min-width:0;padding:8px 10px;font-size:.86rem;white-space:nowrap}
  .lang-switch{padding:3px 6px;gap:4px}
  .lang-switch select{font-size:.82rem;padding:3px 0}
  .lang-globe{font-size:.9rem}
  .who{gap:6px}
  .who-name{display:none}
  .role-chip{display:none}
  .who .btn{min-height:38px;padding:7px 10px}

  .wrap{padding:14px 12px 46px}
  .login{grid-template-columns:1fr;padding:20px;margin-top:10px;border-radius:15px;gap:14px}
  .login h1{max-width:none;font-size:clamp(1.6rem,8vw,2rem)}
  .login .receipt{display:none}
  .hero{grid-template-columns:1fr;padding:20px;border-radius:15px;gap:12px}
  .hero .receipt{display:none}
  .work{grid-template-columns:1fr;border-radius:15px;padding:14px}
  .work .imgwrap{min-height:180px}
  .dgrid{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .field.wide{grid-column:auto}
  .mode-grid{grid-template-columns:1fr;gap:12px}
  .mode-card{padding:16px}

:root{

<style>
/* v22 supplier/customer management and accounting fields */
.v22-counterparty{display:contents}
.v22-counterparty .field-help{grid-column:1/-1}
.field-help{display:block;color:var(--muted);font-size:.78rem;line-height:1.45;margin-top:4px}
.v22-supplier-match{grid-column:1/-1;margin-top:-6px;min-height:1px}
.partner-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 16px}
.v22-partner-count{font-size:.84rem;color:var(--muted);margin:8px 0}
.v22-partner-form{margin:14px 0;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel, var(--surface))}
.v22-partner-form h3{margin:0 0 12px;font-size:1rem}
.v22-partner-table{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:12px}
.v22-partner-table table{width:100%;border-collapse:collapse;min-width:700px}
.v22-partner-table th,.v22-partner-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:.84rem}
.v22-partner-table th{background:var(--paper);font-size:.76rem;letter-spacing:.02em}
.v22-partner-table td small{display:block;color:var(--muted);margin-top:3px}
.v22-partner-table tr:last-child td{border-bottom:0}
#dlg{width:min(1040px,calc(100vw - 24px));max-width:1040px;max-height:calc(100dvh - 24px);overflow:auto}
#dlg .dpad{padding:20px}
#dlg .fields{align-items:start}
#manualForm .field input[readonly],#detailForm .field input[readonly]{opacity:.88}
#manualForm [data-counterparty="customer"] .btn{width:max-content;max-width:100%}
@media(max-width:760px){
  #dlg .dpad{padding:14px}
  .partner-toolbar .btn{flex:1 1 auto}
  .v22-partner-form{padding:12px}
  .v22-partner-table table{min-width:660px}
}

function t(text){
  return (I18N[CURRENT_LANG] && I18N[CURRENT_LANG][text]) || text;
}
function trDynamic(text){
  let s=text;
  if(CURRENT_LANG==='ca') return s;
  const n1=s.match(/^(\d+) de (\d+)$/); if(n1) return `${n1[1]} de ${n1[2]}`;
  const n2=s.match(/^(\d+) (factura|factures)$/); if(n2){const n=Number(n2[1]); return CURRENT_LANG==='es'?`${n} ${n===1?'factura':'facturas'}`:`${n} ${n===1?'invoice':'invoices'}`;}
  const n3=s.match(/^(\d+) (empresa registrada|empreses registrades)$/); if(n3){const n=Number(n3[1]); return CURRENT_LANG==='es'?`${n} ${n===1?'empresa registrada':'empresas registradas'}`:`${n} ${n===1?'registered company':'registered companies'}`;}
  const p=s.match(/^Pujada el (.+?)( · Sense fitxer original adjunt)?$/); if(p){return CURRENT_LANG==='es'?`Subida el ${p[1]}${p[2]?' · Sin archivo original adjunto':''}`:`Uploaded ${p[1]}${p[2]?' · No original file attached':''}`;}
  const ex=s.match(/^(\d+) factures exportades a Excel$/); if(ex){return CURRENT_LANG==='es'?`${ex[1]} facturas exportadas a Excel`:`${ex[1]} invoices exported to Excel`;}
  const f=s.match(/^Factures$/); if(f) return CURRENT_LANG==='es'?'Facturas':'Invoices';
  return t(s);
}
function applyLanguage(root=document){
  document.documentElement.lang=CURRENT_LANG;
  const select=document.querySelector('#langSelect');
  if(select){
    select.value=CURRENT_LANG;
    select.setAttribute('aria-label', CURRENT_LANG==='es' ? 'Selecciona el idioma' : 'Selecciona la llengua');
  }

  root.querySelectorAll?.('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    const value=t(key);
    if(value!==key) el.textContent=value;
  });

  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
    const p=node.parentElement; if(!p || ['SCRIPT','STYLE','NOSCRIPT','TEXTAREA'].includes(p.tagName)) return NodeFilter.FILTER_REJECT;
    if(!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
  for(const node of nodes){
    const raw=node.nodeValue;
    const lead=raw.match(/^\s*/)?.[0]||''; const trail=raw.match(/\s*$/)?.[0]||''; const core=raw.trim();
    const translated=trDynamic(core);
    if(translated!==core) node.nodeValue=lead+translated+trail;
  }
  root.querySelectorAll?.('input[placeholder],select[aria-label],button[title],a[title]').forEach(el=>{
    if(el.placeholder) el.placeholder=trDynamic(el.placeholder);
    if(el.getAttribute('aria-label')) el.setAttribute('aria-label',trDynamic(el.getAttribute('aria-label')));
    if(el.title) el.title=trDynamic(el.title);
  });
}
function setLanguage(lang){
  const titles={ca:'Joan Nogue · Bústia de factures',es:'Joan Nogue · Buzón de facturas'};
  if(!['ca','es'].includes(lang)) return;
  CURRENT_LANG=lang;
  localStorage.setItem(LANGUAGE_STORAGE_KEY,lang);
  document.title=titles[CURRENT_LANG];
  document.documentElement.lang=CURRENT_LANG;
  if(state.user){
    if(state.profile?.role==='manager') state.view==='panel'?managerView():renderCompanyShell();
    else renderCompanyShell();
  }else{ renderLogin(); }
  applyLanguage(document);
}
function initLanguage(){
  document.documentElement.lang=CURRENT_LANG;
  document.title=CURRENT_LANG==='es'?'Joan Nogue · Buzón de facturas':'Joan Nogue · Bústia de factures';
  const select=document.querySelector('#langSelect');
  if(select){
    select.value=CURRENT_LANG;
    if(!select.dataset.languageBound){
      select.addEventListener('change',event=>setLanguage(event.target.value));
      select.dataset.languageBound='true';
    }
  }
  applyLanguage(document);
}

function monthKeyFromDate(value){
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthLabelFromKey(key){
  if(!key) return '';
  const [y,m]=key.split('-').map(Number);
  if(!y||!m) return key;
  return new Intl.DateTimeFormat(CURRENT_LANG==='ca'?'ca-ES':CURRENT_LANG==='es'?'es-ES':'en-US',{month:'long',year:'numeric'}).format(new Date(y,m-1,1));
}
const BULK_DOCUMENT_CATEGORIES = [
  {value:'venta', label:'Document de venda'},
  {value:'compra', label:'Document de compra'},
  {value:'otros', label:'Altres'},
  {value:'cierre_caja', label:'Ticket de tancament de caixa'},
  {value:'bancos', label:'Bancs'}
];
function normalizeBulkCategory(value){
  return BULK_DOCUMENT_CATEGORIES.some(c=>c.value===value) ? value : 'otros';
}
function bulkCategoryLabel(value){
  const category=BULK_DOCUMENT_CATEGORIES.find(c=>c.value===normalizeBulkCategory(value));
  return t(category?.label||'Altres');
}
function bulkFileToken(file){
  return `${String(file?.name||'')}|${Number(file?.size||0)}|${Number(file?.lastModified||0)}`;
}
function bulkCategoryOptions(selected=''){
  return `<option value="">${esc(t('Selecciona la classificació…'))}</option>${BULK_DOCUMENT_CATEGORIES.map(c=>`<option value="${esc(c.value)}" ${selected===c.value?'selected':''}>${esc(t(c.label))}</option>`).join('')}`;
}
function bulkCategoryFilterOptions(selected=''){
  return `<option value="">${esc(t('Totes les classificacions'))}</option>${BULK_DOCUMENT_CATEGORIES.map(c=>`<option value="${esc(c.value)}" ${selected===c.value?'selected':''}>${esc(t(c.label))}</option>`).join('')}`;
}
function bulkMonthOptions(docs, selected=''){
  const keys=[...new Set(docs.map(d=>monthKeyFromDate(d.created_at)).filter(Boolean))].sort().reverse();
  return `<option value="">${esc(t('Tots els mesos'))}</option>${keys.map(k=>`<option value="${esc(k)}" ${selected===k?'selected':''}>${esc(monthLabelFromKey(k))}</option>`).join('')}`;
}
function bulkSummary(docs, month='', category=''){
  const classified=category?docs.filter(d=>normalizeBulkCategory(d.document_category)===category):docs;
  const scoped=month?classified.filter(d=>monthKeyFromDate(d.created_at)===month):classified;
  const nowKey=monthKeyFromDate(new Date());
  return {
    scopedCount:scoped.length,
    total:classified.length,
    thisMonth:classified.filter(d=>monthKeyFromDate(d.created_at)===nowKey).length,
    months:new Set(classified.map(d=>monthKeyFromDate(d.created_at)).filter(Boolean)).size,
    last:classified[0]?.created_at ? fmtStamp(classified[0].created_at) : '—'
  };
}
function bulkGroupedRows(docs, month='', withActions=false, category=''){
  const classified=category?docs.filter(d=>normalizeBulkCategory(d.document_category)===category):docs;
  const scoped=month?classified.filter(d=>monthKeyFromDate(d.created_at)===month):classified;
  if(!scoped.length) return `<div class="empty">${esc(t('No hi ha documents en aquest període.'))}</div>`;
  const groups={};
  for(const d of scoped){
    const k=monthKeyFromDate(d.created_at)||'';
    (groups[k] ||= []).push(d);
  }
  return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,items])=>`
    <div class="bulk-month-group">
      <div class="bulk-month-head"><strong>${esc(monthLabelFromKey(k)||t('Mes no disponible'))}</strong><span>${items.length} ${esc(t('documents'))}</span></div>
      <div class="bulk-list">
        ${items.map(d=>{
          const cat=normalizeBulkCategory(d.document_category);
          const catLabel=bulkCategoryLabel(cat);
          return `<div class="bulk-row">
            <button type="button" class="bulk-file-open" data-act="bulkOpen" data-bulk-id="${esc(d.id)}" aria-label="${esc(t('Obrir'))}: ${esc(d.file_name)}"><b>${esc(d.file_name)}</b><small class="bulk-file-meta">${esc(fmtStamp(d.created_at))} · ${((Number(d.file_size||0)/1024/1024)||0).toFixed(2)} MB <span class="bulk-category-pill" data-category="${esc(cat)}">${esc(catLabel)}</span></small></button>
            ${withActions?`<div class="bulk-row-actions"><button class="btn ghost" data-act="bulkOpen" data-bulk-id="${esc(d.id)}">${t('Obrir')}</button><button class="btn" data-act="bulkDownload" data-bulk-id="${esc(d.id)}">${t('Descarregar')}</button></div>`:`<button class="btn ghost" data-act="bulkOpen" data-bulk-id="${esc(d.id)}">${t('Obrir')}</button>`}
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');
}
function bulkSummaryNote(summary, selectedMonth='', selectedCategory=''){
  const filters=[];
  if(selectedMonth) filters.push(`${t('del mes')} ${monthLabelFromKey(selectedMonth)}`);
  if(selectedCategory) filters.push(`${t('Classificació')}: ${bulkCategoryLabel(selectedCategory)}`);
  if(filters.length) return `${t('Mostrant')} ${summary.scopedCount} ${t('documents').toLowerCase()} · ${filters.join(' · ')}.`;
  return `${summary.total} ${t('documents').toLowerCase()} ${t('disponibles').toLowerCase()}.`;
}

async function renderBulkMineList(){
  const box=$('#bulkMineList');
  const companyId=state.profile?.company_id;
  if(!box||!companyId)return;

  let docs=[];
  try{
    docs=await loadBulkDocuments(companyId)||[];
  }catch(error){
    console.error('Could not load company documents:',error);
    box.innerHTML=`<div class="empty">${esc(t('No s’han pogut carregar els documents.'))}</div>`;
    return;
  }

  if(!state.bulkClientFilters)state.bulkClientFilters=Object.create(null);
  if(!state.bulkClientFilters[companyId]){
    state.bulkClientFilters[companyId]={
      month:box.dataset.month||'',
      category:box.dataset.category||''
    };
  }
  const savedFilters=state.bulkClientFilters[companyId];

function pnlSummary(rows){
  let income=0, expense=0, nonEur=0, unclassified=0;
  const categories={};
  for(const x of rows){
    const cur=normalizeCurrency(x.currency);
    if(cur!=='EUR'){nonEur++;continue;}
    if(x.record_type==='gasto' || x.invoice_type==='recibida'){
      const ex=Number(x.expense_total||0);
      if(ex>0){
        expense+=ex;
        const bd=(x.expense_breakdown&&typeof x.expense_breakdown==='object')?x.expense_breakdown:{};
        for(const [k,v] of Object.entries(bd)) categories[k]=(categories[k]||0)+Number(v||0);
      }else unclassified++;
    }else if(x.record_type==='factura' && x.invoice_type==='emitida'){
      income+=Number(x.base||0);
    }
  }
  return {income,expense,result:income-expense,nonEur,unclassified,categories};
}

}

async function uploadBulkDocuments(){
  if(state.appMode!=='bulk' || !state.profile?.company_id)return;
  const input=$('#bulkPick'); const files=[...(input?.files||[])]; const status=$('#bulkUploadStatus');
  if(!files.length){toast(t('Selecciona fitxers'),true);return;}
  if(!state.bulkCategoryByFile)state.bulkCategoryByFile=Object.create(null);
  const unclassified=files.filter(file=>!state.bulkCategoryByFile[bulkFileToken(file)]);
  if(unclassified.length){
    const message=`${t('Selecciona la classificació de cada document abans de pujar-lo.')}: ${unclassified.map(f=>f.name).join(', ')}`;
    if(status)status.textContent=message;
    toast(message,true);
    return;
  }
  const btn=$('[data-act="uploadBulk"]'); if(btn){btn.disabled=true;btn.textContent=t('Pujant documents…');}
  let done=0; let duplicates=[];
  try{
    // Check the company document list before uploading anything. Comparison ignores case and Unicode normalization.
    const {data:existingDocs,error:checkError}=await sb.from('bulk_documents').select('file_name').eq('company_id',state.profile.company_id);
    if(checkError) throw new Error(t('No s’ha pogut comprovar si el document ja s’ha pujat. Torna-ho a provar.'));
    const existingNames=new Set((existingDocs||[]).map(d=>normalizeBulkFileName(d.file_name)));
    const selectedNames=new Set(); const filesToUpload=[];
    for(const file of files){
      const normalized=normalizeBulkFileName(file.name);
      if(existingNames.has(normalized)||selectedNames.has(normalized)){duplicates.push(file);continue;}
      selectedNames.add(normalized); filesToUpload.push({file,category:state.bulkCategoryByFile[bulkFileToken(file)]});
    }
    if(!filesToUpload.length){
      const message=`${t('Aquest document ja s’ha pujat anteriorment')}: ${duplicates.map(f=>f.name).join(', ')}`;
      if(status)status.textContent=message;
      toast(message,true);
      return;
    }
    for(const item of filesToUpload){
      const {file,category}=item;
      if(file.size>25*1024*1024) throw new Error(`${file.name}: ${t('El fitxer supera el límit de 25 MB.')}`);
      const id=crypto.randomUUID();
      const path=`${state.profile.company_id}/bulk/${id}/${safeName(file.name)}`;
      const {error:up}=await sb.storage.from('invoices').upload(path,file,{upsert:false,contentType:v27MimeForBulkFile(file)});
      if(up) throw new Error(`${file.name}: ${up.message}`);
      const {error:ins}=await sb.from('bulk_documents').insert({id,company_id:state.profile.company_id,file_path:path,file_name:file.name,file_type:v27MimeForBulkFile(file)||file.type||null,file_size:file.size,document_category:normalizeBulkCategory(category),page_count:(state.bulkUploadPageCount||null),uploaded_by:state.user?.id||null});
      if(ins){await sb.storage.from('invoices').remove([path]).catch(()=>{});throw new Error(`${file.name}: ${ins.message}`);}
      done++; if(status) status.textContent=`${done}/${filesToUpload.length} ${t('documents pujats')}`;
    }
    const duplicateTokens=new Set(duplicates.map(bulkFileToken));
    for(const item of filesToUpload){
      const key=bulkFileToken(item.file);
      if(!duplicateTokens.has(key))delete state.bulkCategoryByFile[key];
    }
    if(duplicates.length){
      // Keep rejected duplicates selected with their requested classification so they can be removed or replaced.
      replaceBulkSelectedFiles(duplicates);
      const message=`${t('Fitxers no pujats perquè ja existeixen')}: ${duplicates.map(f=>f.name).join(', ')}`;
      if(status)status.textContent=`${done} ${t('documents pujats')}. ${message}`;
      toast(message,true);
    }else{
      if(input) input.value='';
      renderBulkQueue([]);
      if(status)status.textContent=`${done} ${t('documents pujats')}`;
      toast(t('Documents pujats correctament'));
    }
    await renderBulkMineList();
  }catch(e){toast(e.message||t('No s’han pogut pujar els documents.'),true);if(status)status.textContent=`${done} ${t('documents pujats')}`;}
  finally{if(btn){btn.disabled=false;btn.textContent=t('Pujar documents');}}
}

async function downloadAllBulkDocuments(companyId, companyName, month='', category=''){
  if(!window.JSZip){toast(t('JSZip no està disponible.'),true);return;}
  const allDocs=await loadBulkDocuments(companyId);

  const zip=new JSZip(); const btn=$('[data-act="bulkZip"]'); if(btn){btn.disabled=true;btn.textContent='…'}
  try{
    let i=0;
    for(const doc of docs){
      const {data,error}=await sb.storage.from('invoices').createSignedUrl(doc.file_path,180);
      if(error) throw error;
      const resp=await fetch(data.signedUrl); if(!resp.ok) throw new Error(`${doc.file_name}: HTTP ${resp.status}`);
      const blob=await resp.blob(); zip.file(`${String(++i).padStart(3,'0')}_${safeName(doc.file_name)}`,blob);
    }
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');a.href=url;a.download=`documents_${safeName(companyName||'empresa')}_${new Date().toISOString().slice(0,10)}.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast(`${docs.length} ${t('documents descarregats en ZIP')}`);
  }catch(e){toast(e.message||t('No s’ha pogut crear el ZIP.'),true)}finally{if(btn){btn.disabled=false;btn.textContent=t('Descarregar visibles en ZIP')}}
}

function dataUrlFromFile(file){

function withTimeout(promise, ms, message){
  let timer;
  return Promise.race([
    promise,
    new Promise((_, reject)=>{ timer=setTimeout(()=>reject(new Error(message)), ms); })
  ]).finally(()=>clearTimeout(timer));
}
async function extractInvoiceFromStorage(invoiceId){

function uploadIsActive(opId){

}

async function openUpload(file){
  if(!file) return;
  const selectedType=$('#invoiceTypePick')?.value||state.newEntryType||'';
  if(!selectedType){ toast(t('Has de seleccionar què vols registrar abans de continuar.'),true); renderCompanyShell(); setTimeout(()=>$('#invoiceTypePick')?.focus(),0); return; }
  const maxBytes=15*1024*1024;
  if(file.size>maxBytes){
    renderUploadReview(file,'',{currency:'EUR'},'El fitxer supera el límit de 15 MB per a la lectura automàtica. Prova amb un fitxer més petit.',true);
    return;
  }

  const draftId=crypto.randomUUID();
  state.pendingFile={file,src:'',path:'',values:{currency:'EUR',invoice_type:selectedType},invoice_type:selectedType,draftId,tempInvoiceId:null,opId:draftId};
  $('#view').innerHTML=uploadProgressHtml('Preparant el fitxer…','Preparant el PDF o la imatge per pujar-la de manera segura.',10);
  const src=isPdf(file) ? '' : await dataUrlFromFile(file);
  if(!uploadIsActive(draftId)) return;
  const path=`${state.profile.company_id}/_draft/${draftId}-${safeName(file.name)}`;
  state.pendingFile.src=src;
  state.pendingFile.path=path;

  $('#view').innerHTML=uploadProgressHtml('1/2 · Pujant el fitxer…','Desant temporalment l’original a l’emmagatzematge privat de la teva empresa.',35);
  const {error:up}=await withTimeout(
    sb.storage.from('invoices').upload(path,file,{upsert:false}),
    30000,
    'La subida ha tardado más de 30 segundos. Comprueba tu conexión y vuelve a intentarlo.'
  ).catch(error=>({error}));
  if(up){
    if(!uploadIsActive(draftId)) return;
    state.pendingFile=null;
    await renderUploadReview(file,src,{currency:'EUR'},'No s’ha pogut pujar temporalment el fitxer: '+up.message,true);
    return;
  }
  if(!uploadIsActive(draftId)){
    await sb.storage.from('invoices').remove([path]).catch(()=>{});
    return;
  }

  const {data:tmp,error:tmpErr}=await sb.from('invoices').insert({
    company_id:state.profile.company_id,
    status:'pendiente',
    invoice_type:state.pendingFile.invoice_type,
    file_path:path,
    file_name:file.name,
    file_type:file.type||null
  }).select('id').single();
  if(tmpErr){
    await sb.storage.from('invoices').remove([path]).catch(()=>{});
    if(uploadIsActive(draftId)){
      state.pendingFile=null;
      await renderUploadReview(file,src,{currency:'EUR'},'No s’ha pogut preparar la factura per a la lectura automàtica: '+tmpErr.message,true);
    }
    return;
  }
  if(!uploadIsActive(draftId)){
    await sb.from('invoices').delete().eq('id',tmp.id).catch(()=>{});
    await sb.storage.from('invoices').remove([path]).catch(()=>{});
    return;
  }
  state.pendingFile.tempInvoiceId=tmp.id;

  try{
    if(!uploadIsActive(draftId)){
      await sb.from('invoices').delete().eq('id',tmp.id).catch(()=>{});
      await sb.storage.from('invoices').remove([path]).catch(()=>{});
      return;
    }
    $('#view').innerHTML=uploadProgressHtml('2/2 · Analitzant amb IA…','La Edge Function està llegint el document i extraient-ne les dades de la factura.',70);
    const data=await extractInvoiceFromStorage(tmp.id);
    if(!uploadIsActive(draftId)){
      await sb.from('invoices').delete().eq('id',tmp.id).catch(()=>{});
      await sb.storage.from('invoices').remove([path]).catch(()=>{});
      return;
    }
    await sb.from('invoices').delete().eq('id',tmp.id);
    if(!uploadIsActive(draftId)) return;
    state.pendingFile.tempInvoiceId=null;
    state.pendingFile.values=data.values;
    const warnings=[...data.warnings];
    if(!data.esFactura){
      warnings.unshift('El document no sembla una factura, tiquet o rebut. Comprova que has seleccionat el fitxer correcte.');
    }
    await renderUploadReview(file,src,state.pendingFile.values,warnings.length?('Lectura automàtica completada amb avisos: '+warnings.join(' · ')):'Lectura automàtica completada. Revisa les dades abans de desar-les.',warnings.length>0);
  }catch(e){
    await sb.from('invoices').delete().eq('id',tmp.id).catch(()=>{});
    await sb.storage.from('invoices').remove([path]).catch(()=>{});
    if(!uploadIsActive(draftId)) return;
    state.pendingFile.tempInvoiceId=null;
    await renderUploadReview(file,src,state.pendingFile.values,'No s’ha pogut completar la lectura automàtica: '+(e.message||'error desconocido')+' Pots tornar enrere i triar «Introduir les dades manualment».',true);
  }
}
async function cancelPendingUpload(){

  state.pendingFile=null;
  state.historyFilters={status:'',from:'',to:'',q:''};

  if(p?.tempInvoiceId){
    await sb.from('invoices').delete().eq('id',p.tempInvoiceId).catch(()=>{});
  }
  if(p?.path){
    await sb.storage.from('invoices').remove([p.path]).catch(()=>{});
  }

async function saveUpload(){
  const p=state.pendingFile; if(!p?.path)return;
  const d=readFields($('#uploadForm')),err=$('#uploadErr');
  if(d.record_type==='factura' && !d.invoice_type){err.textContent=t('Selecciona si és una factura rebuda o emesa.');return;}
  if((d.record_type==='gasto'||d.invoice_type==='recibida') && !(Number(d.expense_total)>0)){err.textContent=t('Per a una factura rebuda o una despesa has d’introduir almenys un import al desglose de despeses.');return;}
  if(!d.supplier_name){err.textContent='Indica l’empresa emissora.';return;}
  const btn=$('[data-act="saveUpload"]');btn.disabled=true;btn.textContent='Desant…';
  const {data:ins,error}=await sb.from('invoices').insert({company_id:state.profile.company_id,...d,record_type:d.record_type||p.record_type||'factura',invoice_type:d.record_type==='gasto'?null:normalizeInvoiceType(d.invoice_type||p.invoice_type),expense_breakdown:d.expense_breakdown||{},expense_total:Number(d.expense_total||0),status:'pendiente',file_name:p.file.name,file_type:p.file.type||null}).select().single();
  if(error){err.textContent=error.message;btn.disabled=false;btn.textContent='Desar factura';return}
  const finalPath=`${state.profile.company_id}/${ins.id}/${safeName(p.file.name)}`;
  const {error:mv}=await sb.storage.from('invoices').move(p.path,finalPath);
  if(mv){await sb.from('invoices').delete().eq('id',ins.id);err.textContent='No s’ha pogut finalitzar el fitxer: '+mv.message;btn.disabled=false;btn.textContent='Desar factura';return}
  const {error:patch}=await sb.from('invoices').update({file_path:finalPath}).eq('id',ins.id);
  if(patch){await sb.storage.from('invoices').remove([finalPath]).catch(()=>{});await sb.from('invoices').delete().eq('id',ins.id);err.textContent='No s’ha pogut guardar la ruta del fitxer: '+patch.message;btn.disabled=false;btn.textContent='Desar factura';return}
  state.pendingFile=null; toast('Factura guardada correctament'); state.view='mine'; await loadData(); renderCompanyShell();
}
async function openDetail(id){
  const inv=state.invoices.find(x=>x.id===id); if(!inv)return; state.current=inv;
  const manager=state.profile.role==='manager', own=manager||inv.company_id===state.profile.company_id;
  const hasFile=!!inv.file_path;
  const preview=hasFile?'Carregant…':'Sense fitxer original adjunt';
  $('#dlgBody').innerHTML=`<div class="dhead"><div><h2>${esc(inv.supplier_name||'Factura')}</h2>${statusChip(inv.status)}</div><button class="btn ghost" data-act="close">Tancar</button></div><div class="dgrid"><div><div class="imgwrap" id="detailPreview">${preview}</div><p class="fname">${esc(inv.file_name||'')}</p></div><div><div id="detailForm" class="fields">${fieldsHTML(inv,own)}</div>${manager?`<div class="fields" style="margin-top:14px"><label class="field"><span>Estat</span><select id="detailStatus"><option value="pendiente" ${inv.status==='pendiente'?'selected':''}>Pendent</option><option value="revisada" ${inv.status==='revisada'?'selected':''}>Revisada</option></select></label><label class="field wide"><span>Nota del gestor</span><textarea id="detailNote">${esc(inv.note||'')}</textarea></label></div>`:(inv.note?`<div class="notice" style="margin-top:14px"><b>Nota del gestor:</b> ${esc(inv.note)}</div>`:'')}<p class="err" id="detailErr"></p><div class="actions">${own?'<button class="btn primary" data-act="saveDetail">Desar canvis</button>':''}${hasFile?'<button class="btn" data-act="download">Descarregar original</button>':''}</div><p class="meta">Pujada el ${esc(fmtStamp(inv.created_at))}${hasFile?'':' · Sense fitxer original adjunt'}</p></div></div>`;
  $('#dlg').showModal();
  if(!hasFile)return;
  const {data:signed,error}=await sb.storage.from('invoices').createSignedUrl(inv.file_path,300); const p=$('#detailPreview'); if(signed?.signedUrl){if(inv.file_type==='application/pdf'){p.innerHTML=`<iframe src="${esc(signed.signedUrl)}" style="width:100%;height:68vh;border:0" title="PDF"></iframe>`}else p.innerHTML=`<img src="${esc(signed.signedUrl)}" alt="Factura">`}else p.textContent='Vista prèvia no disponible'; if(error) $('#detailErr').textContent=error.message;
}
async function saveDetail(){
  const inv=state.current, err=$('#detailErr'), v=readFields($('#detailForm')); const patch={...v};
  if(v.record_type==='factura' && !v.invoice_type){err.textContent=t('Selecciona si és una factura rebuda o emesa.');return;}
  if((v.record_type==='gasto'||v.invoice_type==='recibida') && !(Number(v.expense_total)>0)){err.textContent=t('Per a una factura rebuda o una despesa has d’introduir almenys un import al desglose de despeses.');return;}
  if(state.profile.role==='manager'){patch.status=$('#detailStatus').value;patch.note=$('#detailNote').value.trim()||null}
  const {error}=await sb.from('invoices').update(patch).eq('id',inv.id); if(error){err.textContent=error.message;return} toast(t('Canvis desats'));$('#dlg').close();await loadData();
}
async function deleteCurrent(){
  // Els registres i originals ja guardats són immutables des de la interfície.
  toast('Les factures ja desades no es poden eliminar.',true);
}
async function downloadCurrent(){
  const inv=state.current; if(!inv?.file_path){toast('Aquesta factura no té cap fitxer original adjunt.',true);return} const {data,error}=await sb.storage.from('invoices').createSignedUrl(inv.file_path,60); if(error){toast(error.message,true);return} const a=document.createElement('a');a.href=data.signedUrl;a.download=inv.file_name||'factura';a.target='_blank';a.click();
}
async function loadAllRows(table, pageSize=1000){
  const all=[];
  for(let from=0;;from+=pageSize){
    const to=from+pageSize-1;
    const r=await sb.from(table).select('*').order('created_at',{ascending:false}).range(from,to);
    if(r.error) return {data:[],error:r.error};
    const batch=r.data||[];
    all.push(...batch);
    if(batch.length<pageSize) break;
  }
  return {data:all,error:null};
}
async function loadData(){
  if(!state.user)return;
  if(state.profile.role==='manager'){
    const [companiesResult,invoicesResult]=await Promise.all([
      sb.from('companies').select('*').order('name'),
      loadAllRows('invoices',1000)
    ]);
    if(companiesResult.error){toast(companiesResult.error.message,true);return}
    if(invoicesResult.error){toast(invoicesResult.error.message,true);return}
    state.companies=(companiesResult.data||[]).map(x=>({...x,app_mode:x.app_mode==='bulk'?'bulk':'manual'}));
    state.invoices=(invoicesResult.data||[]).map(x=>({...x,currency:normalizeCurrency(x.currency),record_type:normalizeRecordType(x.record_type),invoice_type:normalizeInvoiceType(x.invoice_type),expense_breakdown:x.expense_breakdown||{},expense_total:Number(x.expense_total||0)}));
    if(state.view==='panel')managerView();
  }else{
    if(state.appMode==='bulk'){state.invoices=[];return;}
    const {data,isError}=await fetchCompanyInvoices(); if(isError)return; state.invoices=data||[]; if(state.view==='mine')renderHistory();
  }
}
async function fetchCompanyInvoices(){const r=await sb.from('invoices').select('*').order('created_at',{ascending:false}).limit(500); if(r.error){toast(r.error.message,true);return {data:[],isError:true}} return {data:(r.data||[]).map(x=>({...x,currency:normalizeCurrency(x.currency),record_type:normalizeRecordType(x.record_type),invoice_type:normalizeInvoiceType(x.invoice_type),expense_breakdown:x.expense_breakdown||{},expense_total:Number(x.expense_total||0)})),isError:false}}
async function login(){
  const email=$('#loginEmail')?.value.trim();
  const pass=$('#loginPass')?.value || '';
  const err=$('#loginErr');
  if(err) err.textContent='';
  if(!email || !pass){
    if(err) err.textContent=t('Introdueix el correu electrònic i la contrasenya.');
    return;
  }
  const btn=$('[data-act="login"]');
  if(btn){btn.disabled=true;btn.textContent=t('Entrar')+'…';}
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){
      if(err) err.textContent=error.message || t('No s’ha pogut iniciar la sessió.');
      return;
    }
    state.session=data.session;
    state.user=data.user;
    await loadProfile();
  }catch(ex){
    if(err) err.textContent=ex?.message || t('No s’ha pogut iniciar la sessió.');
  }finally{
    const b=$('[data-act="login"]');
    if(b && !state.user){b.disabled=false;b.textContent=t('Entrar');}
  }
}
async function loadProfile(){
  const {data,error}=await sb.from('profiles').select('*').eq('id',state.user.id).single();
  if(error){await sb.auth.signOut().catch(()=>{});resetSignedOut();renderLogin();const e=$('#loginErr');if(e)e.textContent='No s’ha pogut carregar el perfil. Contacta amb el gestor.';return}
  state.profile=data;
  if(data.role==='company'){
    const {data:company,error:cErr}=await sb.from('companies').select('*').eq('id',data.company_id).single();
    if(cErr||!company){await sb.auth.signOut().catch(()=>{});resetSignedOut();const e=$('#loginErr');if(e)e.textContent='Aquest usuari no està associat a cap empresa configurada.';return;}
    state.company=company; state.appMode=company.app_mode==='bulk'?'bulk':'manual';
  }else{state.company=null;state.appMode='manual';}
  renderWho();state.view=data.role==='manager'?'panel':'mine';await loadData();
  if(data.role==='manager'){ $('#tabs').hidden=false;$('#tabs').innerHTML='<button class="tab" data-act="tab" data-v="panel" aria-pressed="true">Panel del gestor</button>'; managerView(); } else renderCompanyShell();
  applyLanguage(document);
}
function resetSignedOut(){
  state.session=null;
  state.user=null;
  state.profile=null;
  state.invoices=[];
  state.companies=[];
  state.current=null;
  state.pendingFile=null;
  state.company=null;
  state.appMode='manual';
  state.bulkDocuments=[];
  state.newEntryType='';
  state.historyFilters={status:'',type:'',from:'',to:'',q:''};
  state.filters={company:'',type:'',status:'',from:'',to:'',q:''};
  state.view='mine';
  $('#dlg')?.close();
  $('#tabs').hidden=true;
  $('#tabs').innerHTML='';
  renderWho();
  renderLogin();
}

async function logout(){
  if(!sb) return;
  const btn=document.querySelector('[data-act="logout"]');
  if(btn){btn.disabled=true;btn.textContent='Sortint…';}

  const {error}=await sb.auth.signOut();
  if(error){
    if(btn){btn.disabled=false;btn.textContent='Sortir';}
    toast(error.message,true);
    return;
  }

  // No depenem únicament de l'esdeveniment SIGNED_OUT:
  // tanquem la sessió i retornem immediatament a la pantalla d'accés.
  resetSignedOut();
  window.scrollTo({top:0,behavior:'instant'});
}

async function init(){
  sb=getClient(); const {data}=await sb.auth.getSession(); if(data.session){state.session=data.session;state.user=data.session.user;await loadProfile()} else renderLogin();
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){
      resetSignedOut();
    }
  });
}

document.addEventListener('change',e=>{
  if(e.target.id==='filePick'){const f=e.target.files?.[0];e.target.value='';if(f)openUpload(f)}
  if(e.target.id==='bulkPick')return;

  if(e.target.matches('[data-f]')){
    state.filters[e.target.dataset.f]=e.target.value;

  }

});

    else if(a==='tab'){state.view=el.dataset.v;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===state.view)));state.view==='panel'?managerView():renderCompanyShell();}
  }catch(ex){toast(ex.message||'Error inesperat',true)}
});

document.addEventListener('input',e=>{
  if(e.target.matches('[data-expense-k]')){
    const root=e.target.closest('.expense-card');
    if(root){const total=[...root.querySelectorAll('[data-expense-k]')].reduce((a,x)=>a+(Number(String(x.value||'').replace(',','.'))||0),0);const out=root.querySelector('#expenseTotalPreview');if(out)out.textContent=money(total,'EUR');}

<script>
/* v23: protección contra eliminación de facturas y documentos guardados. */
state.suppliers = state.suppliers || [];
state.customers = state.customers || [];
state.partnerType = state.partnerType || 'suppliers';
state.partnerCompanyId = state.partnerCompanyId || null;
state.partnerRows = state.partnerRows || [];
state.partnerEditing = state.partnerEditing || null;
state.partnerReturnToEntry = false;

const V22_INCOME_CONCEPTS = [
  'Venta de mercaderías',
  'Prestación de servicios',
  'Arrendamientos y cánones',
  'Otros ingresos',
  'Caja del día'
];

function v22NormalizeTaxId(v){ return String(v||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,''); }
function v22CompanyForForm(v={}){ return v.company_id || (state.profile?.role==='manager' ? currentManagerCompany()?.id : state.profile?.company_id) || state.profile?.company_id || ''; }
function v22PartnerList(type, companyId){
  const src=type==='suppliers'?state.suppliers:state.customers;
  return (src||[]).filter(x=>!companyId||x.company_id===companyId).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}
async function v22LoadPartners(companyId){
  if(!companyId) throw new Error('No s’ha pogut determinar l’empresa.');
  const [sr,cr]=await Promise.all([
    sb.from('suppliers').select('*').eq('company_id',companyId).order('name',{ascending:true}),
    sb.from('customers').select('*').eq('company_id',companyId).order('name',{ascending:true})
  ]);
  if(sr.error) throw sr.error;
  if(cr.error) throw cr.error;
  state.suppliers=(state.suppliers||[]).filter(x=>x.company_id!==companyId).concat(sr.data||[]);
  state.customers=(state.customers||[]).filter(x=>x.company_id!==companyId).concat(cr.data||[]);
  return {suppliers:sr.data||[],customers:cr.data||[]};
}
function v22FindSupplier(companyId,taxId,name){
  const list=v22PartnerList('suppliers',companyId), tid=v22NormalizeTaxId(taxId), nm=String(name||'').trim().toLocaleLowerCase();
  if(tid)return list.find(x=>v22NormalizeTaxId(x.tax_id)===tid)||null;
  if(nm)return list.find(x=>String(x.name||'').trim().toLocaleLowerCase()===nm)||null;
  return null;
}
function v22FindCustomer(companyId,taxId,name){
  const list=v22PartnerList('customers',companyId), tid=v22NormalizeTaxId(taxId), nm=String(name||'').trim().toLocaleLowerCase();
  if(tid)return list.find(x=>v22NormalizeTaxId(x.tax_id)===tid)||null;
  if(nm)return list.find(x=>String(x.name||'').trim().toLocaleLowerCase()===nm)||null;
  return null;
}
function v22CustomerForRecord(v={},companyId){
  const list=v22PartnerList('customers',companyId);
  if(v.customer_id){const byId=list.find(x=>x.id===v.customer_id);if(byId)return byId;}
  return v22FindCustomer(companyId,v.supplier_tax_id,v.supplier_name);
}
function v22ConceptOptions(v={},editable=true){
  const rt=v.record_type==='gasto'?'gasto':'factura';
  const typ=v.invoice_type||'';
  const choices=(rt==='gasto'||typ==='recibida')?EXPENSE_CATEGORIES.map(([k,l])=>l):(v.income_kind==='caja_dia'?['Caja del día']:V22_INCOME_CONCEPTS.filter(l=>l!=='Caja del día'));
  const current=String(v.concept||'');
  let html='<option value="">Selecciona un concepte…</option>';
  if(current && !choices.includes(current)) html+=`<option value="${esc(current)}" selected>${esc(current)}</option>`;
  html+=choices.map(l=>`<option value="${esc(l)}" ${current===l?'selected':''}>${esc(l)}</option>`).join('');
  return `<label class="field wide"><span>Concepte <b aria-hidden="true">*</b></span><select data-k="concept" ${editable?'':'disabled'} required>${html}</select></label>`;
}
function v22CurrencyField(v={},editable=true){
  const code=normalizeCurrency(v.currency||'EUR');
  const opts=[['EUR','EUR — Euro'],['USD','USD — Dòlar nord-americà'],['GBP','GBP — Lliura esterlina'],['CHF','CHF — Franc suís'],['CAD','CAD — Dòlar canadenc'],['AUD','AUD — Dòlar australià'],['JPY','JPY — Ien japonès']];
  return `<label class="field"><span>Moneda</span><select data-k="currency" ${editable?'':'disabled'}>${opts.map(([c,l])=>`<option value="${c}" ${code===c?'selected':''}>${l}</option>`).join('')}</select></label>`;
}
function v22InvoiceTypeField(v={},editable=true){
  const rt=v.record_type==='gasto'?'gasto':'factura', typ=v.invoice_type||'';
  if(!editable){
    return `<label class="field"><span>Tipus de registre</span><input type="text" value="${rt==='gasto'?'Despesa':'Factura'}" readonly></label><input type="hidden" data-k="record_type" value="${rt}"><input type="hidden" data-k="invoice_type" value="${esc(typ)}">`;
  }
  return `<label class="field"><span>Tipus de registre <b aria-hidden="true">*</b></span><select data-k="record_type" required><option value="factura" ${rt==='factura'?'selected':''}>Factura</option><option value="gasto" ${rt==='gasto'?'selected':''}>Despesa / rebut</option></select></label>
  <label class="field" data-invoice-type-field><span>Tipus de factura <b aria-hidden="true">*</b></span><select data-k="invoice_type" ${rt==='gasto'?'disabled':'required'}><option value="">Selecciona el tipus</option><option value="recibida" ${typ==='recibida'?'selected':''}>Factura rebuda</option><option value="emitida" ${typ==='emitida'?'selected':''}>Factura emesa / ingrés</option></select></label>`;
}
function v22CustomerField(v={},editable=true,companyId=''){
  const list=v22PartnerList('customers',companyId), selected=v22CustomerForRecord(v,companyId)?.id||v.customer_id||'';
  const options=`<option value="">${list.length?'Selecciona un client…':'Cap client donat d’alta'}</option>`+list.map(c=>`<option value="${esc(c.id)}" ${selected===c.id?'selected':''}>${esc(c.name)}${c.tax_id?' · '+esc(c.tax_id):''}</option>`).join('');
  return `<div class="v22-counterparty" data-counterparty="customer">
    <label class="field wide"><span>Client (alta prèvia) <b aria-hidden="true">*</b></span><select data-k="customer_id" ${editable?'':'disabled'}>${options}</select><small class="field-help">Per emetre una factura, primer cal donar d’alta el client.</small></label>
    <input type="hidden" data-customer-counterparty-name value="${esc(v.supplier_name||v22CustomerForRecord(v,companyId)?.name||'')}">
    <input type="hidden" data-customer-counterparty-tax value="${esc(v.supplier_tax_id||v22CustomerForRecord(v,companyId)?.tax_id||'')}">
    <div class="field-help v22-no-customer" ${list.length?'hidden':''}>No hi ha clients. Fes servir «Gestionar clients» abans de registrar la factura.</div>
    <button type="button" class="btn ghost" data-act="manageCustomers" data-company-id="${esc(companyId)}">Gestionar clients</button>
  </div>`;
}
function v22SupplierFields(v={},editable=true){

function v22Field(v,k,label,type='text',wide=false,editable=true,readOnly=false){

window.readFields = function(root){
  const o={};
  root?.querySelectorAll('[data-k]').forEach(x=>{o[x.dataset.k]=String(x.value??'').trim()||null;});
  o.currency=normalizeCurrency(o.currency);
  o.record_type=o.record_type==='gasto'?'gasto':'factura';
  o.invoice_type=(o.invoice_type==='emitida'||o.invoice_type==='recibida')?o.invoice_type:null;
  o.income_kind=o.income_kind==='caja_dia'?'caja_dia':'factura';
  ['base','vat_rate','vat_amount','irpf_rate','irpf_amount','total'].forEach(k=>{
    if(o[k]!==null && o[k]!==undefined){const n=Number(String(o[k]).replace(',','.'));o[k]=Number.isFinite(n)?n:null;}else o[k]=null;
  });
  const oldBreakdown=(()=>{try{return JSON.parse(o.legacy_expense_breakdown||'{}')||{};}catch{return {};}})();
  const oldExpenseTotal=o.expense_total_legacy;
  delete o.legacy_expense_breakdown; delete o.expense_total_legacy;
  const isExpense=o.record_type==='gasto'||o.invoice_type==='recibida';
  if(isExpense){
    const category=EXPENSE_CATEGORIES.find(([k,l])=>l===o.concept);
    if(category && Number(o.base)>0){o.expense_breakdown={[category[0]]:Number(o.base)};o.expense_total=Number(o.base);}
    else if(Object.keys(oldBreakdown).length){o.expense_breakdown=oldBreakdown;o.expense_total=Number(oldExpenseTotal||Object.values(oldBreakdown).reduce((s,x)=>s+Number(x||0),0));}
    else{o.expense_breakdown={};o.expense_total=Number(o.base||0);}
  }else{o.expense_breakdown={};o.expense_total=0;}
  if(o.invoice_type==='emitida'){
    o.record_type='factura';
    if(o.income_kind!=='caja_dia'){
      const cid=root.dataset.companyId||state.profile?.company_id||currentManagerCompany()?.id;
      const customer=v22PartnerList('customers',cid).find(c=>c.id===o.customer_id);
      if(customer){o.supplier_name=customer.name||null;o.supplier_tax_id=customer.tax_id||null;}
      o.supplier_id=null;
    }
    if(o.income_kind==='caja_dia'){
      o.customer_id=null; o.supplier_id=null; o.supplier_name=null; o.supplier_tax_id=null;
      o.invoice_number=o.invoice_number||null;
      o.concept='Caja del día';
    }
  }else{o.customer_id=null; o.income_kind='factura';}
  if(o.record_type==='gasto'||o.invoice_type==='recibida'){o.customer_id=null;o.income_kind='factura';}
  return o;
};
function v22InstallConceptOptions(root){
  if(!root)return;
  const rt=root.querySelector('[data-k="record_type"]')?.value||'factura';
  const typ=rt==='gasto'?'':(root.querySelector('[data-k="invoice_type"]')?.value||'');
  const kind=root.querySelector('[data-k="income_kind"]')?.value||'factura';
  const sel=root.querySelector('[data-k="concept"]'); if(!sel)return;
  const old=sel.value;
  const current=typ==='emitida'&&kind==='caja_dia'?'Caja del día':old;
  const choices=(rt==='gasto'||typ==='recibida')?EXPENSE_CATEGORIES.map(([k,l])=>l):(kind==='caja_dia'?['Caja del día']:V22_INCOME_CONCEPTS.filter(l=>l!=='Caja del día'));
  let html='<option value="">Selecciona un concepte…</option>';
  if(current&&!choices.includes(current))html+=`<option value="${esc(current)}" selected>${esc(current)}</option>`;
  html+=choices.map(l=>`<option value="${esc(l)}" ${l===current?'selected':''}>${esc(l)}</option>`).join('');
  sel.innerHTML=html;
  if(typ==='emitida'&&kind==='caja_dia')sel.value='Caja del día';
}
window.updateManualFormMode = function(){
  const form=$('#manualForm'); if(!form)return;
  v22UpdateFormMode(form);

  const typ=form.querySelector('[data-k="invoice_type"]')?.value||'';
  const kind=form.querySelector('[data-k="income_kind"]')?.value||'factura';
  const cash=rt==='factura'&&typ==='emitida'&&kind==='caja_dia';

function v22UpdateFormMode(root){
  if(!root)return;
  const rt=root.querySelector('[data-k="record_type"]')?.value||'factura';
  const typ=rt==='gasto'?'':(root.querySelector('[data-k="invoice_type"]')?.value||'');
  const kind=root.querySelector('[data-k="income_kind"]')?.value||'factura';
  const isIncome=rt==='factura'&&typ==='emitida';
  const useCustomer=isIncome&&kind!=='caja_dia';
  const sup=root.querySelector('[data-counterparty="supplier"]');
  const cust=root.querySelector('[data-counterparty="customer"]');
  const typeField=root.querySelector('[data-invoice-type-field]');
  const kindField=root.querySelector('[data-income-kind-field]');
  if(typeField)typeField.style.display=rt==='gasto'?'none':'';
  const typSel=root.querySelector('[data-k="invoice_type"]');if(typSel)typSel.disabled=rt==='gasto';
  if(kindField)kindField.style.display=isIncome?'':'none';
  if(sup)sup.style.display=(rt==='gasto'||typ==='recibida')?'':'none';
  if(cust)cust.style.display=useCustomer?'':'none';
  const csel=root.querySelector('[data-k="customer_id"]');if(csel)csel.required=useCustomer;
  const kindSel=root.querySelector('[data-k="income_kind"]');if(kindSel)kindSel.disabled=!isIncome;
  v22InstallConceptOptions(root);
  v22CalculateTotals(root);
}
function v22CalculateTotals(root){
  if(!root)return;
  const get=k=>{const x=root.querySelector(`[data-k="${k}"]`);return x?Number(String(x.value||'').replace(',','.')):0;};
  const set=(k,n)=>{const x=root.querySelector(`[data-k="${k}"]`);if(x)x.value=Number.isFinite(n)?(Math.round(n*100)/100).toFixed(2):'';};
  const base=get('base'), vr=get('vat_rate'), ir=get('irpf_rate');
  set('vat_amount',base*vr/100); set('irpf_amount',base*ir/100); set('total',base+base*vr/100-base*ir/100);
}
function v22ResolveSupplier(root){
  const input=root?.querySelector('[data-k="supplier_tax_id"]'); if(!input)return;
  const cid=v22CompanyForForm({company_id:root.dataset.companyId||''});
  const tax=input.value; const nm=root.querySelector('[data-counterparty="supplier"] [data-k="supplier_name"]')?.value||'';
  const hit=v22FindSupplier(cid,tax,nm);
  const idInput=root.querySelector('[data-counterparty="supplier"] [data-k="supplier_id"]');
  if(idInput)idInput.value=hit?.id||'';
  const note=root.querySelector('.v22-supplier-match');
  if(hit){
    const nameInput=root.querySelector('[data-counterparty="supplier"] [data-k="supplier_name"]');if(nameInput)nameInput.value=hit.name||'';
    const concept=root.querySelector('[data-k="concept"]');if(concept&&hit.usual_concept){const exists=[...concept.options].some(o=>o.value===hit.usual_concept);if(exists)concept.value=hit.usual_concept;}
    const vat=root.querySelector('[data-k="vat_rate"]');if(vat&&hit.default_vat_rate!==null&&hit.default_vat_rate!==undefined)vat.value=hit.default_vat_rate;
    const irpf=root.querySelector('[data-k="irpf_rate"]');if(irpf&&hit.default_irpf_rate!==null&&hit.default_irpf_rate!==undefined)irpf.value=hit.default_irpf_rate;
    if(note)note.textContent=`Proveïdor reconegut: ${hit.name}. S’han recuperat les dades habituals.`;
  }else{if(note)note.textContent=tax?'Aquest NIF no consta als proveïdors d’aquesta empresa. En desar podràs donar-lo d’alta o continuar.':'';}
  v22CalculateTotals(root);
}
function v22PopulateCustomer(root){
  const select=root?.querySelector('[data-k="customer_id"]');if(!select)return;
  const cid=v22CompanyForForm({company_id:root.dataset.companyId||''});
  const customer=v22PartnerList('customers',cid).find(x=>x.id===select.value);
  const name=root.querySelector('[data-counterparty="customer"] [data-customer-counterparty-name]');
  const tax=root.querySelector('[data-counterparty="customer"] [data-customer-counterparty-tax]');
  if(name)name.value=customer?.name||'';
  if(tax)tax.value=customer?.tax_id||'';

    const vat=root.querySelector('[data-k="vat_rate"]');if(vat&&customer.default_vat_rate!==null&&customer.default_vat_rate!==undefined)vat.value=customer.default_vat_rate;
    const irpf=root.querySelector('[data-k="irpf_rate"]');if(irpf&&customer.default_irpf_rate!==null&&customer.default_irpf_rate!==undefined)irpf.value=customer.default_irpf_rate;
  }
  v22CalculateTotals(root);
}

window.saveManual = async function(skipUnknownPartnerCheck=false){
  const form=$('#manualForm'),err=$('#manualErr');if(!form||!err)return;
  const d=readFields(form); d.company_id=state.profile.company_id;
  const rt=d.record_type, typ=d.invoice_type, cash=rt==='factura'&&typ==='emitida'&&d.income_kind==='caja_dia';
  if(rt==='factura'&&!typ){err.textContent=t('Selecciona si és una factura rebuda o emesa.');return;}
  if(typ==='emitida'&&!cash){const customer=v22PartnerList('customers',d.company_id).find(c=>c.id===d.customer_id);if(!customer){err.textContent='Abans de registrar una factura emesa, dona d’alta i selecciona el client.';return;}}
  if((rt==='gasto'||typ==='recibida')&&!d.supplier_name){err.textContent='Indica el proveïdor o beneficiari.';return;}
  if(!(Number(d.base)>0)){err.textContent='Introdueix una base imposable superior a zero.';return;}
  if(!d.concept){err.textContent='Selecciona un concepte de la llista.';return;}
  const file=$('#manualFile')?.files?.[0]||null;
  if(rt==='factura'&&!cash&&!file){err.textContent='Les factures rebudes i emeses a un client requereixen un fitxer PDF o imatge.';return;}
  if(file&&file.size>25*1024*1024){err.textContent=t('El fitxer supera el límit de 25 MB.');return;}
  if((rt==='gasto'||typ==='recibida')&&!skipUnknownPartnerCheck){
    const supplier=v22FindSupplier(d.company_id,d.supplier_tax_id,d.supplier_name);
    if(!supplier){v22OpenUnknownSupplier(d);return;}
    d.supplier_id=supplier.id;
    d.supplier_name=supplier.name||d.supplier_name;
    d.supplier_tax_id=supplier.tax_id||d.supplier_tax_id;
  }
  const btn=$('[data-act="saveManual"]');if(btn){btn.disabled=true;btn.textContent='Desant…';}
  const baseRec={company_id:d.company_id,record_type:rt,invoice_type:rt==='gasto'?null:typ,income_kind:cash?'caja_dia':'factura',supplier_id:(rt==='gasto'||typ==='recibida')?(d.supplier_id||null):null,customer_id:typ==='emitida'&&!cash?(d.customer_id||null):null,supplier_name:cash?'Caja del día':d.supplier_name,supplier_tax_id:cash?null:d.supplier_tax_id,invoice_number:d.invoice_number,invoice_date:d.invoice_date,currency:d.currency,concept:cash?'Caja del día':d.concept,base:d.base,vat_rate:d.vat_rate,vat_amount:d.vat_amount,irpf_rate:d.irpf_rate,irpf_amount:d.irpf_amount,total:d.total,expense_breakdown:d.expense_breakdown||{},expense_total:Number(d.expense_total||0),status:'pendiente',file_name:file?.name||null,file_type:file?.type||null};
  const {data:ins,error}=await sb.from('invoices').insert(baseRec).select().single();
  if(error){err.textContent=error.message;if(btn){btn.disabled=false;btn.textContent='Desar registre';}return;}
  if(file){
    const finalPath=`${state.profile.company_id}/${ins.id}/${safeName(file.name)}`;
    const {error:up}=await sb.storage.from('invoices').upload(finalPath,file,{upsert:false});
    if(up){await sb.from('invoices').delete().eq('id',ins.id);err.textContent='No s’ha pogut guardar el fitxer original: '+up.message;if(btn){btn.disabled=false;btn.textContent='Desar registre';}return;}
    const {error:patch}=await sb.from('invoices').update({file_path:finalPath}).eq('id',ins.id);
    if(patch){await sb.storage.from('invoices').remove([finalPath]).catch(()=>{});await sb.from('invoices').delete().eq('id',ins.id);err.textContent='No s’ha pogut guardar la ruta del fitxer: '+patch.message;if(btn){btn.disabled=false;btn.textContent='Desar registre';}return;}
  }
  toast('Registre guardat correctament');state.pendingFile=null;state.view='mine';state.newEntryType='';await loadData();renderCompanyShell();
};

async function v22SavePartner(){
  const err=$('#partnerErr'),btn=$('[data-act="savePartner"]'),supplier=state.partnerType==='suppliers',table=supplier?'suppliers':'customers';
  const d=v22ReadPartnerForm();if(!d.name){if(err)err.textContent='El nombre es obligatorio.';return;}
  const tid=v22NormalizeTaxId(d.tax_id);if(tid){const dupe=v22PartnerList(state.partnerType,state.partnerCompanyId).find(x=>x.id!==state.partnerEditing?.id&&v22NormalizeTaxId(x.tax_id)===tid);if(dupe){if(err)err.textContent=`Ese NIF ya está registrado a nombre de ${dupe.name}.`;return;}}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  try{
    if(a==='manageSuppliers')await v22OpenPartners('suppliers',el.dataset.companyId||state.partnerCompanyId||state.profile?.company_id||currentManagerCompany()?.id);
    else if(a==='manageCustomers')await v22OpenPartners('customers',el.dataset.companyId||state.partnerCompanyId||state.profile?.company_id||currentManagerCompany()?.id);
    else if(a==='partnerClose'){state.partnerReturnToEntry=false;$('#dlg').close();}
    else if(a==='partnerNew'){state.partnerEditing=null;state.partnerPrefill=state.partnerPrefill||null;v22RenderPartnersDialog(true,null,state.partnerPrefill);}
    else if(a==='partnerEdit')v22OpenPartnerEdit(el.dataset.id);
    else if(a==='partnerCancelForm')v22RenderPartnersDialog(false);
    else if(a==='savePartner')await v22SavePartner();
    else if(a==='partnerDelete')await v22DeletePartner(el.dataset.id);
    else if(a==='unknownAdd'){
      const d=state.unknownSupplierDraft||{};const cid=state.profile?.company_id||state.partnerCompanyId;
      await v22OpenPartners('suppliers',cid,{tax_id:d.supplier_tax_id||'',name:d.supplier_name||'',default_vat_rate:d.vat_rate??'',default_irpf_rate:d.irpf_rate??'',usual_concept:d.concept||'',fromUnknown:true});
      v22RenderPartnersDialog(true,null,state.partnerPrefill);
    }
    else if(a==='unknownContinue'){$('#dlg').close();window.saveManual(true);}
  }catch(err){toast(err.message||'S’ha produït un error.',true);}
});

function v24ConceptLabel(value){
  const s=String(value??'');
  if(s==='Caja del día') return t('Caja del día');
  return t(s);
}
function v24CountryDisplay(value){
  const map={'España':'Espanya','Francia':'França','Italia':'Itàlia','Reino Unido':'Regne Unit','Otro':'Altres'};
  return t(map[String(value||'')]||String(value||''));
}
function v24AllOptions(select){
  if(!select) return [];
  return select.__v24AllOptions || [...select.options].map(o=>({value:o.value,label:o.textContent,disabled:o.disabled,placeholder:o.value==='' }));
}
function v24FilterSelect(select,query=''){
  if(!select) return;
  const all=v24AllOptions(select), q=String(query||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
  const current=select.value;
  let match=all.filter(o=>o.placeholder || !q || `${o.label} ${o.value}`.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().includes(q));
  if(current && !match.some(o=>o.value===current)){
    const selected=all.find(o=>o.value===current);
    if(selected) match.splice(1,0,selected);
  }
  if(q && match.filter(o=>!o.placeholder).length===0){
    const label=t('No s’han trobat conceptes.');
    match=[...(match.filter(o=>o.placeholder)),{value:'',label,disabled:true,placeholder:false}];
  }
  select.replaceChildren(...match.map(o=>{const el=document.createElement('option');el.value=o.value;el.textContent=o.label;el.disabled=!!o.disabled;return el;}));
  select.value=current && [...select.options].some(o=>o.value===current) ? current : '';
}
function v24EnhanceConceptSearch(root=document){
  root.querySelectorAll?.('#manualForm [data-k="concept"],#detailForm [data-k="concept"],#uploadForm [data-k="concept"],[data-pk="usual_concept"]').forEach(select=>{
    if(select.disabled) return;
    const label=select.closest('label.field'); if(!label) return;
    let search=label.querySelector('[data-concept-search]');
    if(!search){
      search=document.createElement('input');search.type='search';search.className='v24-concept-search';search.dataset.conceptSearch='1';search.autocomplete='off';
      search.placeholder=select.matches('[data-pk="usual_concept"]')?t('Cercar un concepte habitual…'):t('Cercar un concepte…');
      search.setAttribute('aria-label',search.placeholder);
      select.parentNode.insertBefore(search,select);
      const help=document.createElement('small');help.className='field-help v24-concept-help';help.textContent=t('Escriu per filtrar les opcions i selecciona el concepte al desplegable.');select.parentNode.insertBefore(help,select);
    }
    if(!select.__v24AllOptions){
      select.__v24AllOptions=[...select.options].map(o=>({value:o.value,label:o.textContent,disabled:o.disabled,placeholder:o.value===''}));
    }
    if(!search.dataset.v24Bound){
      search.dataset.v24Bound='1';
      search.addEventListener('input',()=>{
        const q=search.value;
        if(select.value){const current=v24AllOptions(select).find(o=>o.value===select.value);if(current && q && !`${current.label} ${current.value}`.toLocaleLowerCase().includes(q.toLocaleLowerCase()))select.value='';}
        v24FilterSelect(select,q);
      });
      search.addEventListener('keydown',ev=>{
        if(ev.key==='Escape'){search.value='';v24FilterSelect(select,'');}
        if(ev.key==='Enter'){ev.preventDefault();const choice=[...select.options].find(o=>o.value && !o.disabled);if(choice){select.value=choice.value;select.dispatchEvent(new Event('change',{bubbles:true}));search.value='';v24FilterSelect(select,'');select.focus();}}
      });
    }
  });
}

/* The options keep their canonical stored values; only their visible labels are translated. */
v22InstallConceptOptions = function(root){
  if(!root)return;
  const rt=root.querySelector('[data-k="record_type"]')?.value||'factura';
  const typ=rt==='gasto'?'':(root.querySelector('[data-k="invoice_type"]')?.value||'');
  const kind=root.querySelector('[data-k="income_kind"]')?.value||'factura';
  const sel=root.querySelector('[data-k="concept"]'); if(!sel)return;
  const mode=`${rt}|${typ}|${kind}`;
  const previousMode=sel.__v24Mode;
  const search=sel.closest('label.field')?.querySelector('[data-concept-search]');
  if(previousMode && previousMode!==mode && search) search.value='';
  let current=sel.value;
  const choices=(rt==='gasto'||typ==='recibida')?EXPENSE_CATEGORIES.map(([,label])=>label):(kind==='caja_dia'?['Caja del día']:V24_INCOME_CONCEPTS.filter(l=>l!=='Caja del día'));
  if(previousMode && previousMode!==mode && current && !choices.includes(current)){current='';sel.value='';}
  sel.__v24Mode=mode;
  const all=[];
  all.push({value:'',label:t('Selecciona un concepte…'),placeholder:true});
  if(current && !choices.includes(current)) all.push({value:current,label:v24ConceptLabel(current),placeholder:false});
  for(const label of choices){if(!all.some(o=>o.value===label))all.push({value:label,label:v24ConceptLabel(label),placeholder:false});}
  sel.__v24AllOptions=all;
  const q=search?.value||'';
  v24FilterSelect(sel,q);
  if(typ==='emitida'&&kind==='caja_dia'){
    sel.value='Caja del día';
    if(search)search.value='';
    v24FilterSelect(sel,'');
  }
  v24EnhanceConceptSearch(root);
};

  const input=root?.querySelector('[data-k="supplier_tax_id"]');if(!input)return;
  const cid=v22CompanyForForm({company_id:root.dataset.companyId||''}),tax=input.value,nm=root.querySelector('[data-counterparty="supplier"] [data-k="supplier_name"]')?.value||'';
  const hit=v22FindSupplier(cid,tax,nm),idInput=root.querySelector('[data-counterparty="supplier"] [data-k="supplier_id"]'),note=root.querySelector('.v22-supplier-match');
  if(idInput)idInput.value=hit?.id||'';
  if(hit){
    const nameInput=root.querySelector('[data-counterparty="supplier"] [data-k="supplier_name"]');if(nameInput)nameInput.value=hit.name||'';
    const concept=root.querySelector('[data-k="concept"]');if(concept&&hit.usual_concept&&[...concept.options].some(o=>o.value===hit.usual_concept))concept.value=hit.usual_concept;
    const vat=root.querySelector('[data-k="vat_rate"]');if(vat&&hit.default_vat_rate!==null&&hit.default_vat_rate!==undefined)vat.value=hit.default_vat_rate;
    const irpf=root.querySelector('[data-k="irpf_rate"]');if(irpf&&hit.default_irpf_rate!==null&&hit.default_irpf_rate!==undefined)irpf.value=hit.default_irpf_rate;
    if(note)note.textContent=t('Proveïdor reconegut: {name}. S’han recuperat les dades habituals.').replace('{name}',hit.name||'');
  }else if(note){note.textContent=tax?t('Aquest NIF no consta als proveïdors d’aquesta empresa. En desar podràs donar-lo d’alta o continuar.'):'';}
  v22CalculateTotals(root);
};
