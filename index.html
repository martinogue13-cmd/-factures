v22SavePartner = async function(){
  const err=$('#partnerErr'),btn=$('[data-act="savePartner"]'),supplier=state.partnerType==='suppliers',table=supplier?'suppliers':'customers';
  const d=v22ReadPartnerForm();
  if(!d.name){if(err)err.textContent=t('El nom és obligatori.');return;}
  const tid=v22NormalizeTaxId(d.tax_id);
  if(tid){const duplicate=v22PartnerList(state.partnerType,state.partnerCompanyId).find(x=>x.id!==state.partnerEditing?.id&&v22NormalizeTaxId(x.tax_id)===tid);if(duplicate){if(err)err.textContent=t('Aquest NIF ja està registrat a nom de {name}.').replace('{name}',duplicate.name);return;}}
  d.company_id=state.partnerCompanyId;d.updated_at=new Date().toISOString();
  if(btn){btn.disabled=true;btn.textContent=t('Desant…');}
  let result;
  if(state.partnerEditing)result=await sb.from(table).update(d).eq('id',state.partnerEditing.id).eq('company_id',state.partnerCompanyId).select().single();
  else result=await sb.from(table).insert(d).select().single();
  if(result.error){if(err)err.textContent=result.error.message;if(btn){btn.disabled=false;btn.textContent=t('Desar');}return;}
  const shouldReturn=state.partnerReturnToEntry&&supplier,cid=state.partnerCompanyId;
  toast(t(supplier?'Proveïdor guardat correctament':'Client guardat correctament'));
  state.partnerEditing=null;state.partnerPrefill=null;state.partnerReturnToEntry=false;
  await v22LoadPartners(cid);
  if(shouldReturn){$('#dlg').close();const note=$('#manualErr');if(note)note.textContent=t('Proveïdor donat d’alta. Revisa les dades i torna a prémer «Desar registre».');window.updateManualFormMode();return;}
  v22RenderPartnersDialog(false);
};
v22DeletePartner = async function(id){
  const supplier=state.partnerType==='suppliers',table=supplier?'suppliers':'customers',item=v22PartnerList(state.partnerType,state.partnerCompanyId).find(x=>x.id===id);
  if(!item||!confirm(`${t(supplier?'Eliminar proveïdor':'Eliminar client')} «${item.name}»? ${t('Els registres històrics es conservaran.')}`))return;
  const {error}=await sb.from(table).delete().eq('id',id).eq('company_id',state.partnerCompanyId);
  if(error){toast(error.message,true);return;}toast(t('Registre eliminat del llistat'));await v22LoadPartners(state.partnerCompanyId);v22RenderPartnersDialog(false);
};

state.bulkCategoryByFile = state.bulkCategoryByFile || Object.create(null);
document.addEventListener('change',e=>{
  if(e.target.matches?.('[data-bulk-category][data-bulk-token]')){
    try{
      const token=decodeURIComponent(e.target.dataset.bulkToken||'');
      if(!state.bulkCategoryByFile)state.bulkCategoryByFile=Object.create(null);
      if(e.target.value)state.bulkCategoryByFile[token]=e.target.value;else delete state.bulkCategoryByFile[token];
    }catch(_){toast(t('No s’ha pogut desar la classificació del document.'),true);}
    return;
  }
  if(e.target.id==='bulkMineCategory'){
    const box=$('#bulkMineList'); if(box){box.dataset.category=e.target.value;renderBulkMineList();}
  }
  if(e.target.id==='bulkManagerCategory'){
    const box=$('#bulkManagerDashboard'); const company=currentManagerCompany();
    if(box&&company){
      if(!state.bulkManagerFilters)state.bulkManagerFilters=Object.create(null);
      const previous=state.bulkManagerFilters[company.id]||{};
      state.bulkManagerFilters[company.id]={month:$('#bulkManagerMonth')?.value||previous.month||'',category:e.target.value};
      renderManagerBulk(company);
    }
  }
});

const V27_ALLOWED_EXTENSIONS = new Set(['pdf','jpg','jpeg','png','gif','webp','bmp','tif','tiff','heic','heif','avif','doc','docx','docm','xls','xlsx','xlsm','xlsb','csv','tsv','ods','odt','rtf','txt','md','ppt','pptx','pptm','odp','xml','json','pages','numbers','zip']);
function v27BulkFileAllowed(file){
  const name=String(file?.name||'');
  const dot=name.lastIndexOf('.');
  const ext=dot>=0?name.slice(dot+1).toLowerCase():'';
  return V27_ALLOWED_EXTENSIONS.has(ext);
}
function v27MimeForBulkFile(file){
  const ext=String(file?.name||'').split('.').pop().toLowerCase();
  const map={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',tif:'image/tiff',tiff:'image/tiff',heic:'image/heic',heif:'image/heif',avif:'image/avif',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',docm:'application/vnd.ms-word.document.macroEnabled.12',xls:'application/vnd.ms-excel',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',xlsm:'application/vnd.ms-excel.sheet.macroEnabled.12',xlsb:'application/vnd.ms-excel.sheet.binary.macroEnabled.12',csv:'text/csv',tsv:'text/tab-separated-values',ods:'application/vnd.oasis.opendocument.spreadsheet',odt:'application/vnd.oasis.opendocument.text',rtf:'application/rtf',txt:'text/plain',md:'text/markdown',ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',pptm:'application/vnd.ms-powerpoint.presentation.macroEnabled.12',odp:'application/vnd.oasis.opendocument.presentation',xml:'application/xml',json:'application/json',pages:'application/vnd.apple.pages',numbers:'application/vnd.apple.numbers',zip:'application/zip'};
  return file?.type && file.type!=='application/octet-stream' ? file.type : (map[ext]||file?.type||'application/octet-stream');
}
const v27OriginalUploadBulkDocuments = uploadBulkDocuments;
uploadBulkDocuments = async function(){
  if(state.appMode!=='bulk' || !state.profile?.company_id)return;
  const files=[...($('#bulkPick')?.files||[])];
  if(!files.length){toast(t('Selecciona fitxers'),true);return;}
  const unsupported=files.filter(file=>!v27BulkFileAllowed(file));
  if(unsupported.length){toast(`${t('Format no admès. Puja PDF, imatges, documents de Word o Excel, presentacions i fitxers de text.')}: ${unsupported.map(f=>f.name).join(', ')}`,true);return;}
  const oversized=files.filter(file=>file.size>25*1024*1024);
  if(oversized.length){toast(`${t('El fitxer supera el límit de 25 MB.')}: ${oversized.map(f=>f.name).join(', ')}`,true);return;}
  return await v27OriginalUploadBulkDocuments();
};
function v27StatusOf(doc){
  if(doc?.received_at) return 'received';
  if(doc?.downloaded_at) return 'pending_receipt';
  return 'pending_download';
}
function v27StatusLabel(status){
  return ({pending_download:t('Pendent de descàrrega'),pending_receipt:t('Descarregat · pendent de recepció'),received:t('Recepcionat')})[status]||t('Tots els estats');
}
function v27StatusOptions(selected=''){
  const options=[['','Tots els estats'],['pending_download','Pendent de descàrrega'],['pending_receipt','Descarregat · pendent de recepció'],['received','Recepcionat']];
  return options.map(([v,l])=>`<option value="${esc(v)}" ${selected===v?'selected':''}>${esc(t(l))}</option>`).join('');
}
function v27BulkStatusMatches(doc,status){return !status||v27StatusOf(doc)===status;}
function v27BulkWorkflow(doc){
  const upload=doc.created_at?fmtStamp(doc.created_at):'—';
  const downloaded=doc.downloaded_at?fmtStamp(doc.downloaded_at):'';
  const received=doc.received_at?fmtStamp(doc.received_at):'';
  return `<div class="bulk-workflow" aria-label="${esc(t('Estat del document'))}">
    <span class="bulk-workflow-step is-done"><b>${esc(t('Pujat'))}</b><small>${esc(upload)}</small></span>
    <span class="bulk-workflow-step ${doc.downloaded_at?'is-done':'is-pending'}"><b>${esc(doc.downloaded_at?t('Descarregat'):t('Pendent de descàrrega'))}</b><small>${esc(downloaded||'—')}</small></span>
    <span class="bulk-workflow-step ${doc.received_at?'is-done':'is-pending'}"><b>${esc(doc.received_at?t('Recepcionat'):t('Pendent de recepció'))}</b><small>${esc(received||'—')}</small></span>
  </div>`;
}

bulkSummary = function(docs, month='', category='', status=''){
  const classified=(docs||[]).filter(d=>(!category||normalizeBulkCategory(d.document_category)===category)&&v27BulkStatusMatches(d,status));
  const scoped=month?classified.filter(d=>monthKeyFromDate(d.created_at)===month):classified;
  const nowKey=monthKeyFromDate(new Date());
  return {scopedCount:scoped.length,total:classified.length,thisMonth:classified.filter(d=>monthKeyFromDate(d.created_at)===nowKey).length,months:new Set(classified.map(d=>monthKeyFromDate(d.created_at)).filter(Boolean)).size,last:classified[0]?.created_at?fmtStamp(classified[0].created_at):'—'};
};
bulkGroupedRows = function(docs, month='', withActions=false, category='', status=''){
  const classified=(docs||[]).filter(d=>(!category||normalizeBulkCategory(d.document_category)===category)&&v27BulkStatusMatches(d,status));
  const scoped=month?classified.filter(d=>monthKeyFromDate(d.created_at)===month):classified;
  if(!scoped.length)return `<div class="empty">${esc(t('No hi ha documents en aquest període.'))}</div>`;
  const groups={};
  for(const d of scoped){const k=monthKeyFromDate(d.created_at)||'';(groups[k] ||= []).push(d);}
  return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,items])=>`
    <div class="bulk-month-group"><div class="bulk-month-head"><strong>${esc(monthLabelFromKey(k)||t('Mes no disponible'))}</strong><span>${items.length} ${esc(t('documents'))}</span></div><div class="bulk-list">
    ${items.map(d=>{const cat=normalizeBulkCategory(d.document_category);return `<div class="bulk-row v27-bulk-row">
      <div class="v27-bulk-main"><button type="button" class="bulk-file-open" data-act="bulkOpen" data-bulk-id="${esc(d.id)}" aria-label="${esc(t('Obrir'))}: ${esc(d.file_name)}"><b>${esc(d.file_name)}</b></button><small class="bulk-file-meta">${esc(fmtStamp(d.created_at))} · ${((Number(d.file_size||0)/1024/1024)||0).toFixed(2)} MB <span class="bulk-category-pill" data-category="${esc(cat)}">${esc(bulkCategoryLabel(cat))}</span></small>${v27BulkWorkflow(d)}</div>
      ${withActions?`<div class="bulk-row-actions"><button class="btn ghost" data-act="bulkOpen" data-bulk-id="${esc(d.id)}">${t('Obrir')}</button><button class="btn primary" data-act="bulkDownload" data-bulk-id="${esc(d.id)}">${t('Descarregar')}</button></div>`:`<button class="btn ghost" data-act="bulkOpen" data-bulk-id="${esc(d.id)}">${t('Obrir')}</button>`}
    </div>`;}).join('')}</div></div>`).join('');
};
bulkSummaryNote = function(summary,selectedMonth='',selectedCategory='',selectedStatus=''){
  const filters=[];if(selectedMonth)filters.push(`${t('del mes')} ${monthLabelFromKey(selectedMonth)}`);if(selectedCategory)filters.push(`${t('Classificació')}: ${bulkCategoryLabel(selectedCategory)}`);if(selectedStatus)filters.push(`${t('Estat del document')}: ${v27StatusLabel(selectedStatus)}`);
  if(filters.length)return `${t('Mostrant')} ${summary.scopedCount} ${t('documents').toLowerCase()} · ${filters.join(' · ')}.`;
  return `${summary.total} ${t('documents').toLowerCase()} ${t('disponibles').toLowerCase()}.`;
};

renderBulkQueue = function(files){
  const q=$('#bulkQueue');if(!q)return;if(!state.bulkCategoryByFile)state.bulkCategoryByFile=Object.create(null);
  q.innerHTML=(files||[]).map((f,i)=>{const token=bulkFileToken(f);const selected=state.bulkCategoryByFile[token]||'';return `<div class="bulk-row bulk-queue-row"><div class="bulk-queue-file"><b>${esc(f.name)}</b><small>${(f.size/1024/1024).toFixed(2)} MB · ${esc((f.name.split('.').pop()||'').toUpperCase())}</small></div><label class="field bulk-category-field"><span>${t('Classificació del document')}</span><select data-bulk-category data-bulk-token="${esc(encodeURIComponent(token))}">${bulkCategoryOptions(selected)}</select></label><button type="button" class="btn ghost bulk-remove-btn" data-act="removeBulkSelected" data-file-index="${i}" title="${esc(t('Treure de la selecció'))}" aria-label="${esc(t('Treure de la selecció'))}: ${esc(f.name)}">&times;</button></div>`;}).join('');q.dataset.count=String((files||[]).length);
};

  const box=$('#bulkCompany');if(!box)return;const accept='.pdf,image/*,.doc,.docx,.docm,.xls,.xlsx,.xlsm,.xlsb,.csv,.tsv,.ods,.odt,.rtf,.txt,.md,.ppt,.pptx,.pptm,.odp,.xml,.json,.pages,.numbers,.zip,.jpg,.jpeg,.png,.gif,.webp,.bmp,.tif,.tiff,.heic,.heif,.avif';
  box.innerHTML=`<section class="hero bulk-upload"><div><div class="corporate-label">${t('Bústia corporativa · Joan Nogue')}</div><div class="eyebrow">${t('Visió de càrrega de documents')}</div><h1>${t('Càrrega massiva de documents')}</h1><p>${t('Selecciona diversos documents i indica la classificació de cadascun abans de pujar-los.')}</p><div class="bulk-drop"><label class="field"><span>${t('Fitxers PDF, imatges, Word, Excel i altres documents')}</span><input id="bulkPick" type="file" accept="${accept}" multiple></label><p class="vision-note">${t('Pots seleccionar diversos documents alhora. Mida màxima: 25 MB per fitxer.')}</p><div class="bulk-queue-heading">${t('Documents preparats')}</div><div id="bulkQueue" class="bulk-list"></div><div class="bulk-actions"><button class="btn primary" data-act="uploadBulk">${t('Pujar documents')}</button></div></div><p class="meta" id="bulkUploadStatus" role="status" aria-live="polite"></p></div></section>
  <section class="hero bulk-uploaded" style="margin-top:18px"><div><div class="eyebrow">${t('Documents pujats')}</div><div class="section-head" style="margin:0 0 10px"><h2 style="margin:0">${t('Els meus documents')}</h2><button class="btn" data-act="refreshBulkMine">${t('Actualitzar')}</button></div><p class="sub">${t('Aquí pots comprovar quins documents ja has pujat i quan es van registrar. Fes clic al nom d’un document per obrir-lo.')}</p><div id="bulkMineList" class="bulk-list"><div class="empty">${esc(t('Carregant…'))}</div></div></div></section>`;
  $('#bulkPick')?.addEventListener('change',e=>renderBulkQueue([...(e.target.files||[])]));
  applyLanguage($('#bulkCompany'));setupBulkRealtime(state.profile?.company_id);await renderBulkMineList();
};

renderBulkMineList = async function(){
  const companyId=state.profile?.company_id;if(!companyId)return;
  const docs=await loadBulkDocuments(companyId);const box=$('#bulkMineList');if(!box)return;
  if(!state.bulkMineFilters)state.bulkMineFilters=Object.create(null);const saved=state.bulkMineFilters[companyId]||{};
  const selected=saved.month??box.dataset.month??'';const selectedCategory=saved.category??box.dataset.category??'';const selectedStatus=saved.status??box.dataset.status??'';

async function v27RecordBulkDownload(docIds,confirmReceived){

async function v27RefreshBulkStatuses(companyId){

async function v27DownloadBlob(blob,fileName){
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fileName||'document';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function v27PerformSingleDownload(action,confirmReceived){
  const doc=action.doc;
  try{
    const {data,error}=await sb.storage.from('invoices').createSignedUrl(doc.file_path,300);if(error||!data?.signedUrl)throw error||new Error(t('No s’ha pogut descarregar el document.'));
    const response=await fetch(data.signedUrl);if(!response.ok)throw new Error(`${doc.file_name}: HTTP ${response.status}`);
    await v27DownloadBlob(await response.blob(),doc.file_name);
    try{await v27RecordBulkDownload([doc.id],confirmReceived);toast(confirmReceived?t('Recepció confirmada'):t('Descàrrega registrada'));await v27RefreshBulkStatuses(action.companyId);}catch(statusError){toast(t('El document s’ha descarregat, però no s’ha pogut sincronitzar l’estat a Supabase.'),true);console.error(statusError);}
  }catch(error){toast(error.message||t('No s’ha pogut descarregar el document.'),true);}
}
async function v27PerformZipDownload(action,confirmReceived){
  if(!window.JSZip){toast(t('JSZip no està disponible.'),true);return;}
  const btn=$('[data-act="bulkZip"]');if(btn){btn.disabled=true;btn.textContent='…'}
  try{
    const zip=new JSZip();let i=0;
    for(const doc of action.docs){const {data,error}=await sb.storage.from('invoices').createSignedUrl(doc.file_path,240);if(error||!data?.signedUrl)throw error||new Error(`${doc.file_name}: ${t('No s’ha pogut descarregar el document.')}`);const response=await fetch(data.signedUrl);if(!response.ok)throw new Error(`${doc.file_name}: HTTP ${response.status}`);zip.file(`${String(++i).padStart(3,'0')}_${safeName(doc.file_name)}`,await response.blob());}
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});await v27DownloadBlob(blob,`documents_${safeName(action.companyName||'empresa')}_${new Date().toISOString().slice(0,10)}.zip`);
    try{await v27RecordBulkDownload(action.docIds,confirmReceived);toast(confirmReceived?t('Recepció confirmada'):t('Descàrrega registrada'));await v27RefreshBulkStatuses(action.companyId);}catch(statusError){toast(t('Els documents s’han descarregat, però no s’ha pogut sincronitzar l’estat a Supabase.'),true);console.error(statusError);}
  }catch(error){toast(error.message||t('No s’ha pogut descarregar el paquet ZIP.'),true)}finally{const current=$('[data-act="bulkZip"]');if(current){current.disabled=false;current.textContent=t('Descarregar visibles en ZIP')}}
}

function setupBulkRealtime(companyId){

    if(state.profile?.role==='manager'){const c=currentManagerCompany();if(c?.id===companyId&&c.app_mode==='bulk')renderManagerBulk(c).catch(e=>console.error(e));}

function v28ManagerStatus(doc){ return v27StatusOf(doc); }
function v28ManagerScope(docs, month='', category=''){
  return (docs||[]).filter(d=>(!month||monthKeyFromDate(d.created_at)===month)&&(!category||normalizeBulkCategory(d.document_category)===category));
}
function v28LatestDownloaded(docs){
  return (docs||[]).filter(d=>d.downloaded_at).sort((a,b)=>String(b.downloaded_at).localeCompare(String(a.downloaded_at)))[0]||null;
}
function v28ManagerStatusSummary(docs){
  const pending=(docs||[]).filter(d=>v28ManagerStatus(d)==='pending_download').length;
  const awaiting=(docs||[]).filter(d=>v28ManagerStatus(d)==='pending_receipt').length;
  const received=(docs||[]).filter(d=>v28ManagerStatus(d)==='received').length;
  return {total:(docs||[]).length,pending,awaiting,received,latest:v28LatestDownloaded(docs)};
}
function v28ManagerRows(docs, month='', category='', status=''){
  const scoped=v28ManagerScope(docs,month,category).filter(d=>v27BulkStatusMatches(d,status));
  if(!scoped.length)return `<div class="empty">${esc(t('No hi ha documents en aquest període.'))}</div>`;
  const rank={pending_download:0,pending_receipt:1,received:2};
  const groups={};
  for(const d of scoped){const k=monthKeyFromDate(d.created_at)||'';(groups[k] ||= []).push(d);}
  return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,items])=>{
    items.sort((a,b)=>{
      const ar=rank[v28ManagerStatus(a)],br=rank[v28ManagerStatus(b)];if(ar!==br)return ar-br;
      if(ar===1)return String(b.downloaded_at||'').localeCompare(String(a.downloaded_at||''));
      if(ar===2)return String(b.received_at||'').localeCompare(String(a.received_at||''));
      return String(b.created_at||'').localeCompare(String(a.created_at||''));
    });
    return `<div class="bulk-month-group"><div class="bulk-month-head"><strong>${esc(monthLabelFromKey(k)||t('Mes no disponible'))}</strong><span>${items.length} ${esc(t('documents'))}</span></div><div class="bulk-list">${items.map(d=>{

      let detail=t('Encara no descarregat');
      if(st==='pending_receipt')detail=`${t('Descarregat el')} ${fmtStamp(d.downloaded_at)}`;
      if(st==='received')detail=`${t('Descarregat el')} ${fmtStamp(d.downloaded_at)} · ${t('Recepcionat el')} ${fmtStamp(d.received_at)}`;
      const icon=st==='pending_download'?'○':st==='pending_receipt'?'↓':'✓';

          <div class="v28-file-title-line"><button type="button" class="bulk-file-open" data-act="bulkOpen" data-bulk-id="${esc(d.id)}" aria-label="${esc(t('Obrir'))}: ${esc(d.file_name)}"><b>${esc(d.file_name)}</b></button><span class="v28-status-badge v28-state-${esc(st)}"><span aria-hidden="true">${icon}</span> ${esc(statusText)}</span></div>
          <small class="bulk-file-meta">${esc(t('Pujat'))}: ${esc(fmtStamp(d.created_at))} · ${((Number(d.file_size||0)/1024/1024)||0).toFixed(2)} MB <span class="bulk-category-pill" data-category="${esc(cat)}">${esc(bulkCategoryLabel(cat))}</span></small>
          <div class="v28-download-proof ${st==='pending_download'?'v28-proof-pending':''}">${st==='pending_download'?`<b>${esc(t('Encara no descarregat'))}</b>`:`<b>${esc(detail)}</b>`}</div>
          ${v27BulkWorkflow(d)}
        </div>
        <div class="bulk-row-actions"><button class="btn ghost" data-act="bulkOpen" data-bulk-id="${esc(d.id)}">${t('Obrir')}</button><button class="btn primary" data-act="bulkDownload" data-bulk-id="${esc(d.id)}">${st==='pending_download'?t('Descarregar'):t('Descarregar de nou')}</button></div>
      </div>`;
    }).join('')}</div></div>`;

}

function v30SyncBulkUploadGate(){
  const categorySelect=$('#bulkUploadCategory');
  const input=$('#bulkPick');
  const notice=$('#bulkClassifyNotice');
  const uploadButton=$('[data-act="uploadBulk"]');
  const files=input?[...input.files]:[];
  const category=state.bulkUploadCategory||'';
  if(categorySelect){categorySelect.value=category;categorySelect.disabled=files.length>0;}
  if(input){input.disabled=!category;}
  if(notice){
    if(!category){
      notice.textContent=t('Selecciona una classificació per continuar.');
      notice.classList.remove('is-ready');notice.classList.add('is-required');
      notice.setAttribute('role','alert');
    }else if(files.length){
      notice.textContent=`${t('Classificació aplicada')}: ${bulkCategoryLabel(category)}. ${t('Per canviar la classificació, treu tots els documents seleccionats.')}`;
      notice.classList.remove('is-required');notice.classList.add('is-ready');
      notice.setAttribute('role','status');
    }else{
      notice.textContent=`${t('Classificació seleccionada')}: ${bulkCategoryLabel(category)}. ${t('Ara pots seleccionar els documents que vols pujar.')}`;
      notice.classList.remove('is-required');notice.classList.add('is-ready');
      notice.setAttribute('role','status');
    }
  }
  if(uploadButton)uploadButton.disabled=!category||files.length===0;
}

renderBulkQueue = function(files){
  const q=$('#bulkQueue');if(!q)return;
  const category=state.bulkUploadCategory||'';
  if(!state.bulkCategoryByFile)state.bulkCategoryByFile=Object.create(null);
  const activeTokens=new Set((files||[]).map(bulkFileToken));
  for(const token of Object.keys(state.bulkCategoryByFile)){
    if(!activeTokens.has(token))delete state.bulkCategoryByFile[token];
  }
  q.innerHTML=(files||[]).map((file,i)=>{
    const token=bulkFileToken(file);
    if(category)state.bulkCategoryByFile[token]=category;
    const ext=(file.name.split('.').pop()||'').toUpperCase();
    return `<div class="bulk-row bulk-queue-row">
      <div class="bulk-queue-file"><b>${esc(file.name)}</b><small>${(file.size/1024/1024).toFixed(2)} MB · ${esc(ext)}${category?` <span class="bulk-category-pill" data-category="${esc(category)}">${esc(bulkCategoryLabel(category))}</span>`:''}</small></div>
      <button type="button" class="btn ghost bulk-remove-btn" data-act="removeBulkSelected" data-file-index="${i}" title="${esc(t('Treure de la selecció'))}" aria-label="${esc(t('Treure de la selecció'))}: ${esc(file.name)}">&times;</button>
    </div>`;
  }).join('');
  q.dataset.count=String((files||[]).length);
};

replaceBulkSelectedFiles = function(files){
  const input=$('#bulkPick');if(!input)return;
  try{
    const transfer=new DataTransfer();
    (files||[]).forEach(file=>transfer.items.add(file));
    input.files=transfer.files;
  }catch(_){
    if(!(files||[]).length)input.value='';
  }
  const actualFiles=[...(input.files||[])];
  if(!actualFiles.length){
    state.bulkUploadCategory='';
    state.bulkCategoryByFile=Object.create(null);
    const select=$('#bulkUploadCategory');if(select)select.value='';
  }else if(state.bulkUploadCategory){
    if(!state.bulkCategoryByFile)state.bulkCategoryByFile=Object.create(null);
    actualFiles.forEach(file=>state.bulkCategoryByFile[bulkFileToken(file)]=state.bulkUploadCategory);
  }
  renderBulkQueue(actualFiles);
  v30SyncBulkUploadGate();
};

function v31StatusOf(doc){ return doc?.received_at ? 'received' : 'uploaded'; }
v27StatusOf = v31StatusOf;
v28ManagerStatus = v31StatusOf;
function v31StatusLabel(status){ return status==='received' ? t('Recepcionat correctament') : status==='uploaded' ? t('Pendent de validació') : t('Tots els estats'); }
v27StatusLabel = v31StatusLabel;
v27StatusOptions = function(selected=''){
  return `<option value="">${esc(t('Tots els estats'))}</option><option value="uploaded" ${selected==='uploaded'?'selected':''}>${esc(t('Pendent de validació'))}</option><option value="received" ${selected==='received'?'selected':''}>${esc(t('Recepcionat correctament'))}</option>`;
};
v27BulkStatusMatches = function(doc,status){ return !status || v31StatusOf(doc)===status; };
v27BulkWorkflow = function(doc){
  const received=!!doc?.received_at;
  return `<div class="v31-status-line"><span class="v31-state-chip ${received?'is-received':'is-uploaded'}"><b>${esc(t(received?'Recepcionat correctament':'Pendent de validació'))}</b></span>${received?`<span class="v31-receipt-date">${esc(t('Recepcionat el'))}: ${esc(fmtStamp(doc.received_at))}</span>`:''}</div>`;
};

function v31CategoryOverview(docs, selectedCategory=''){
  const items=BULK_DOCUMENT_CATEGORIES.map(c=>{
    const count=(docs||[]).filter(d=>normalizeBulkCategory(d.document_category)===c.value).length;
    const active=selectedCategory===c.value;
    return `<button type="button" class="v31-category-card ${active?'is-active':''}" data-act="bulkCategoryJump" data-category="${esc(c.value)}" aria-pressed="${active?'true':'false'}"><span class="v31-category-name">${esc(t(c.label))}</span><strong>${count}</strong><small>${esc(t('documents'))}</small></button>`;
  }).join('');
  return `<section class="v31-category-overview"><div class="v31-section-heading"><h3>${esc(t('Documents per classificació'))}</h3><p>${esc(t('Selecciona una categoria per filtrar els documents.'))}</p></div><div class="v31-category-grid">${items}</div></section>`;
}
function v31DocumentGroupsHtml(docs, month='', category='', status='', withActions=false){
  const scoped=(docs||[]).filter(d=>(!month||monthKeyFromDate(d.created_at)===month)&&(!category||normalizeBulkCategory(d.document_category)===category)&&v27BulkStatusMatches(d,status));
  if(!scoped.length)return `<div class="empty">${esc(t('No hi ha documents amb aquests filtres.'))}</div>`;
  return BULK_DOCUMENT_CATEGORIES.map(cat=>{
    const catDocs=scoped.filter(d=>normalizeBulkCategory(d.document_category)===cat.value);
    if(!catDocs.length)return '';
    const byMonth={};
    for(const doc of catDocs){const key=monthKeyFromDate(doc.created_at)||'';(byMonth[key] ||= []).push(doc);}
    const monthHtml=Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([key,items])=>{
      items.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
      return `<div class="v31-month-block"><div class="v31-month-heading"><strong>${esc(monthLabelFromKey(key)||t('Mes no disponible'))}</strong><span>${items.length} ${esc(t('documents'))}</span></div><div class="bulk-list">${items.map(doc=>{
        const received=!!doc.received_at;
        const stateClass=received?'is-received':'is-uploaded';
        return `<article class="bulk-row v31-document-row ${stateClass}">
          <div class="v31-document-main">
            <div class="v31-document-title"><button type="button" class="bulk-file-open" data-act="bulkOpen" data-bulk-id="${esc(doc.id)}" aria-label="${esc(t('Obrir'))}: ${esc(doc.file_name)}"><b>${esc(doc.file_name)}</b></button><span class="v31-state-chip ${stateClass}">${esc(t(received?'Recepcionat correctament':'Pendent de validació'))}</span></div>
            <small class="bulk-file-meta"><span>${esc(t('Pujat el'))}: ${esc(fmtStamp(doc.created_at))}</span> · ${((Number(doc.file_size||0)/1024/1024)||0).toFixed(2)} MB</small>
            ${received?`<div class="v31-receipt-date">${esc(t('Recepcionat el'))}: ${esc(fmtStamp(doc.received_at))}</div>`:''}
          </div>
          <span class="bulk-category-pill" data-category="${esc(cat.value)}">${esc(t(cat.label))}</span>
          <div class="bulk-row-actions"><button type="button" class="btn ghost" data-act="bulkOpen" data-bulk-id="${esc(doc.id)}">${esc(t('Obrir'))}</button>${withActions?`<button type="button" class="btn primary" data-act="bulkDownload" data-bulk-id="${esc(doc.id)}">${esc(t('Descarregar'))}</button>`:''}</div>
        </article>`;
      }).join('')}</div></div>`;
    }).join('');
    return `<section class="v31-classification-group"><div class="v31-classification-heading"><h3>${esc(t(cat.label))}</h3><span>${catDocs.length} ${esc(t('documents'))}</span></div>${monthHtml}</section>`;
  }).join('');
}
function v31BulkFilterSummary(docs, month='', category='', status=''){
  const scoped=(docs||[]).filter(d=>(!month||monthKeyFromDate(d.created_at)===month)&&(!category||normalizeBulkCategory(d.document_category)===category)&&v27BulkStatusMatches(d,status));
  const phrase=status?v31StatusLabel(status):category?bulkCategoryLabel(category):month?monthLabelFromKey(month):t('totes els mesos');
  return `${scoped.length} ${t('documents').toLowerCase()} · ${esc(phrase)}`;
}

  state.bulkMineFilters[companyId]={month,category,status};

  state.bulkDocuments=docs;applyLanguage(content);

v27ShowDownloadConfirmation = function(action){
  state.pendingBulkDownload=action;
  const single=action.kind==='single';
  const title=t('Confirmació de recepció');
  const description=single?`${t('Estàs a punt de descarregar:')} <b>${esc(action.doc.file_name)}</b>`:`${t('Estàs a punt de descarregar els documents inclosos en aquest ZIP')} <b>(${action.docs.length})</b>`;
  const checkboxLabel=single?t('Confirmo que he rebut aquest document.'):t('Confirmo que he rebut tots els documents inclosos en aquest ZIP.');
  $('#dlgBody').innerHTML=`<div class="dhead"><div><h2>${esc(title)}</h2></div><button class="btn ghost" data-act="bulkCancelReceipt">${esc(t('Cancel·lar'))}</button></div><div class="notice" style="margin-top:14px">${description}</div><p class="sub" style="margin:12px 0">${esc(t('Marca la casella si confirmes que has rebut aquests documents. Si no, continuaran amb l’estat «Pendent de validació».'))}</p><label class="v27-confirm-check"><input type="checkbox" id="bulkReceiptConfirm"><span>${esc(checkboxLabel)}</span></label><p class="meta">${esc(t('Si marques la casella, el document passarà a «Recepcionat correctament» tant per al gestor com per al client.'))}</p><div class="actions"><button class="btn" data-act="bulkCancelReceipt">${esc(t('Cancel·lar'))}</button><button class="btn primary" data-act="bulkConfirmDownload">${esc(single?t('Descarregar document'):t('Descarregar documents'))}</button></div>`;
  if(!$('#dlg').open)$('#dlg').showModal();applyLanguage($('#dlgBody'));
};

downloadBulkDocument = async function(doc){ if(doc)v27ShowDownloadConfirmation({kind:'single',doc,companyId:doc.company_id,docIds:[doc.id]}); };
downloadAllBulkDocuments = async function(companyId,companyName,month='',category='',status){
  const saved=state.bulkManagerFilters?.[companyId]||{};
  if(status===undefined)status=saved.status||'';
  const allDocs=await loadBulkDocuments(companyId);
  const docs=allDocs.filter(d=>(!month||monthKeyFromDate(d.created_at)===month)&&(!category||normalizeBulkCategory(d.document_category)===category)&&v27BulkStatusMatches(d,status));
  if(!docs.length){toast(t('No hi ha documents amb aquests filtres.'),true);return;}
  v27ShowDownloadConfirmation({kind:'zip',companyId,companyName,docs,docIds:docs.map(d=>d.id)});
};
async function v31RecordReceipt(docIds){
  const {data,error}=await sb.rpc('record_bulk_documents_receipt',{p_document_ids:docIds});
  if(error)throw error;
  if(typeof data==='number'&&data<docIds.length)throw new Error(t('No s’ha pogut registrar la recepció a Supabase.'));
}
async function v31PerformSingleDownload(action,confirmReceived){
  try{
    const {data,error}=await sb.storage.from('invoices').createSignedUrl(action.doc.file_path,300);
    if(error||!data?.signedUrl)throw error||new Error(t('No s’ha pogut descarregar el document.'));
    const response=await fetch(data.signedUrl);if(!response.ok)throw new Error(`${action.doc.file_name}: HTTP ${response.status}`);
    await v27DownloadBlob(await response.blob(),action.doc.file_name);
    if(confirmReceived){
      try{await v31RecordReceipt([action.doc.id]);toast(t('Recepció confirmada'));await v27RefreshBulkStatuses(action.companyId);}
      catch(err){toast(t('El document s’ha descarregat però no s’ha pogut confirmar la recepció.'),true);console.error(err);}
    }else toast(t('Descàrrega completada. L’estat continua sent «Pendent de validació» fins que confirmis la recepció.'));
  }catch(error){toast(error.message||t('No s’ha pogut descarregar el document.'),true);}
}
async function v31PerformZipDownload(action,confirmReceived){
  if(!window.JSZip){toast(t('JSZip no està disponible.'),true);return;}
  try{
    const zip=new JSZip();let i=0;
    for(const doc of action.docs){const {data,error}=await sb.storage.from('invoices').createSignedUrl(doc.file_path,240);if(error||!data?.signedUrl)throw error||new Error(`${doc.file_name}: ${t('No s’ha pogut descarregar el document.')}`);const response=await fetch(data.signedUrl);if(!response.ok)throw new Error(`${doc.file_name}: HTTP ${response.status}`);zip.file(`${String(++i).padStart(3,'0')}_${safeName(doc.file_name)}`,await response.blob());}
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});await v27DownloadBlob(blob,`documents_${safeName(action.companyName||'empresa')}_${new Date().toISOString().slice(0,10)}.zip`);
    if(confirmReceived){
      try{await v31RecordReceipt(action.docIds);toast(t('Recepció confirmada'));await v27RefreshBulkStatuses(action.companyId);}
      catch(err){toast(t('Els documents s’han descarregat però no s’ha pogut confirmar la recepció.'),true);console.error(err);}
    }else toast(t('Descàrrega completada. L’estat continua sent «Pendent de validació» fins que confirmis la recepció.'));
  }catch(error){toast(error.message||t('No s’ha pogut descarregar el paquet ZIP.'),true);}
}
v27PerformSingleDownload = v31PerformSingleDownload;
v27PerformZipDownload = v31PerformZipDownload;

/* Intercept category cards and keep the selected group synchronized with the normal filters. */
document.addEventListener('click',e=>{
  const card=e.target.closest?.('[data-act="bulkCategoryJump"]');if(!card)return;
  e.preventDefault();e.stopImmediatePropagation();
  const requested=card.dataset.category||'';
  if(state.profile?.role==='manager'){
    const company=currentManagerCompany();if(!company)return;
    const prior=state.bulkManagerFilters?.[company.id]||{};
    const category=prior.category===requested?'':requested;
    state.bulkManagerFilters[company.id]={month:$('#bulkManagerMonth')?.value??prior.month??'',category,status:$('#bulkManagerStatus')?.value??prior.status??'',pageCount:''};
    renderManagerBulk(company).catch(err=>toast(err.message,true));
  }else{
    const companyId=state.profile?.company_id;if(!companyId)return;
    const prior=state.bulkMineFilters?.[companyId]||{};
    const category=prior.category===requested?'':requested;
    state.bulkMineFilters[companyId]={month:$('#bulkMineMonth')?.value??prior.month??'',category,status:$('#bulkMineStatus')?.value??prior.status??'',pageCount:''};
    renderBulkMineList().catch(err=>toast(err.message,true));
  }
},true);

  }
  function v32PageMatches(doc, filter='') {
    if(!filter) return true;

      &&(!category||normalizeBulkCategory(doc.document_category)===category)

      &&v32PageMatches(doc,pageCount));

  function v32SyncUploadGate(){

    if(pageSelect){pageSelect.value=needsPage?pageCount:'';pageSelect.disabled=!needsPage||files.length>0;}

      if(!category){notice.textContent=t('Selecciona una classificació per continuar.');notice.classList.remove('is-ready');notice.classList.add('is-required');notice.setAttribute('role','alert');}

    }
    if(uploadButton)uploadButton.disabled=!canPick||files.length===0;
  }
  v30SyncBulkUploadGate = v32SyncUploadGate;

  renderBulkQueue = function(files){

      }
      if(!state.bulkCategoryByFile)state.bulkCategoryByFile=Object.create(null);
      files.forEach(file=>state.bulkCategoryByFile[bulkFileToken(file)]=category);
      renderBulkQueue(files);v32SyncUploadGate();
    });
    applyLanguage($('#bulkCompany'));v32SyncUploadGate();setupBulkRealtime(state.profile?.company_id);await renderBulkMineList();
  };

  const v32UploadBase = uploadBulkDocuments;
  uploadBulkDocuments = async function(){
    if(state.appMode!=='bulk'||!state.profile?.company_id)return;
    const files=[...($('#bulkPick')?.files||[])];
    const category=state.bulkUploadCategory||$('#bulkUploadCategory')?.value||'';
    const pageCount=normalizePageCount(state.bulkUploadPageCount||$('#bulkUploadPageCount')?.value||'');
    const status=$('#bulkUploadStatus');
    if(!BULK_DOCUMENT_CATEGORIES.some(c=>c.value===category)){
      const message=t('Selecciona una classificació per continuar.');if(status)status.textContent=message;toast(message,true);v32SyncUploadGate();return;
    }
    if(!pageCount){
      const message=t('Indica si el document té una pàgina o diverses abans de continuar.');if(status)status.textContent=message;toast(message,true);v32SyncUploadGate();return;
    }
    if(pageCount==='varias_paginas'&&files.some(v32IsImageFile)){
      const message=t('Per a documents de diverses pàgines, no es permet fer una foto ni seleccionar imatges de la galeria. Tria un PDF o un altre document.');if(status)status.textContent=message;toast(message,true);v32SyncUploadGate();return;
    }
    if(!files.length){const message=t('Selecciona documents per pujar.');if(status)status.textContent=message;toast(message,true);v32SyncUploadGate();return;}
    state.bulkUploadCategory=category;state.bulkUploadPageCount=pageCount;
    if(!state.bulkCategoryByFile)state.bulkCategoryByFile=Object.create(null);
    files.forEach(file=>state.bulkCategoryByFile[bulkFileToken(file)]=category);
    await v32UploadBase();
    const remaining=[...($('#bulkPick')?.files||[])];
    if(!remaining.length){state.bulkUploadCategory='';state.bulkUploadPageCount='';state.bulkCategoryByFile=Object.create(null);const c=$('#bulkUploadCategory');if(c)c.value='';const p=$('#bulkUploadPageCount');if(p)p.value='';}
    else remaining.forEach(file=>state.bulkCategoryByFile[bulkFileToken(file)]=category);
    renderBulkQueue(remaining);v32SyncUploadGate();
  };

  function v32PageFilterOptions(value=''){
    return `<option value="">${esc(t('Totes les pàgines'))}</option><option value="una_pagina" ${value==='una_pagina'?'selected':''}>${esc(t('Una pàgina'))}</option><option value="varias_paginas" ${value==='varias_paginas'?'selected':''}>${esc(t('Diverses pàgines'))}</option><option value="pendent" ${value==='pendent'?'selected':''}>${esc(t('Pendent de classificar pàgines'))}</option>`;
  }
  function v32CategoryOverview(docs, selectedCategory='', selectedPageCount='', showPageSubfilters=true){
    const items=BULK_DOCUMENT_CATEGORIES.map(cat=>{
      const catDocs=(docs||[]).filter(doc=>normalizeBulkCategory(doc.document_category)===cat.value);
      const active=selectedCategory===cat.value;
      const name=esc(t(cat.label));
      const pageSummary=showPageSubfilters?`<div class="v32-page-counts"><span>${esc(t('Una pàgina'))}: <b>${catDocs.filter(d=>normalizePageCount(d.page_count)==='una_pagina').length}</b></span><span>${esc(t('Diverses pàgines'))}: <b>${catDocs.filter(d=>normalizePageCount(d.page_count)==='varias_paginas').length}</b></span><span>${esc(t('Pendent de classificar pàgines'))}: <b>${catDocs.filter(d=>!normalizePageCount(d.page_count)).length}</b></span></div>`:'';
      const pageShortcuts=showPageSubfilters?`<div class="v32-page-subfilters"><button type="button" data-act="bulkPageJump" data-category="${esc(cat.value)}" data-page-count="una_pagina" class="v32-page-filter-chip ${selectedCategory===cat.value&&selectedPageCount==='una_pagina'?'is-active':''}">${esc(t('Una pàgina'))}</button><button type="button" data-act="bulkPageJump" data-category="${esc(cat.value)}" data-page-count="varias_paginas" class="v32-page-filter-chip ${selectedCategory===cat.value&&selectedPageCount==='varias_paginas'?'is-active':''}">${esc(t('Diverses pàgines'))}</button></div>`:'';
      return `<div class="v32-category-card-wrap"><button type="button" class="v31-category-card ${active?'is-active':''}" data-act="bulkCategoryJump" data-category="${esc(cat.value)}" aria-pressed="${active?'true':'false'}"><span class="v31-category-name">${name}</span><strong>${catDocs.length}</strong><small>${esc(t('documents'))}</small></button>${pageSummary}${pageShortcuts}</div>`;
    }).join('');
    return `<section class="v31-category-overview v32-category-overview"><div class="v31-section-heading"><h3>${esc(t('Documents per classificació'))}</h3><p>${esc(t('Selecciona una categoria per filtrar els documents.'))}</p></div><div class="v31-category-grid v32-category-grid">${items}</div></section>`;
  }

  function v32DocumentGroupsHtml(docs, month='', category='', status='', pageCount='', withActions=false){
    const scoped=v32ScopedDocs(docs,month,category,status,pageCount);
    if(!scoped.length)return `<div class="empty">${esc(t('No hi ha documents amb aquests filtres.'))}</div>`;
    return BULK_DOCUMENT_CATEGORIES.map(cat=>{
      const catDocs=scoped.filter(doc=>normalizeBulkCategory(doc.document_category)===cat.value);
      if(!catDocs.length)return '';
      const pageGroups=withActions
        ?[['una_pagina',catDocs.filter(d=>normalizePageCount(d.page_count)==='una_pagina')],['varias_paginas',catDocs.filter(d=>normalizePageCount(d.page_count)==='varias_paginas')],['pendent',catDocs.filter(d=>!normalizePageCount(d.page_count))]].filter(g=>g[1].length)
        :[['',catDocs]];
      const pageHtml=pageGroups.map(([pageKey,pageDocs])=>{
        const byMonth={};for(const doc of pageDocs){const key=monthKeyFromDate(doc.created_at)||'';(byMonth[key] ||= []).push(doc);}
        const monthHtml=Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([key,items])=>{
          items.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
          return `<div class="v31-month-block"><div class="v31-month-heading"><strong>${esc(monthLabelFromKey(key)||t('Mes no disponible'))}</strong><span>${items.length} ${esc(t('documents'))}</span></div><div class="bulk-list">${items.map(doc=>{
            const received=!!doc.received_at;const stateClass=received?'is-received':'is-uploaded';
            return `<article class="bulk-row v31-document-row v43-document-row ${stateClass}"><div class="v31-document-main"><div class="v31-document-title"><button type="button" class="bulk-file-open" data-act="bulkOpen" data-bulk-id="${esc(doc.id)}" aria-label="${esc(t('Obrir'))}: ${esc(doc.file_name)}"><b>${esc(doc.file_name)}</b></button></div><small class="bulk-file-meta"><span>${esc(t('Pujat el'))}: ${esc(fmtStamp(doc.created_at))}</span> · ${((Number(doc.file_size||0)/1024/1024)||0).toFixed(2)} MB</small>${(withActions||doc.page_count)?`<div class="v32-doc-page-label">${esc(t('Classificació de pàgines'))}: <b>${esc(pageLabel(normalizePageCount(doc.page_count)))}</b></div>`:''}${received?`<div class="v31-receipt-date">${esc(t('Recepcionat el'))}: ${esc(fmtStamp(doc.received_at))}</div>`:''}</div><div class="v43-document-badges"><span class="v31-state-chip ${stateClass}">${esc(t(received?'Recepcionat correctament':'Pendent de validació'))}</span><span class="bulk-category-pill" data-category="${esc(cat.value)}">${esc(t(cat.label))}</span></div><div class="bulk-row-actions"><button type="button" class="btn ghost" data-act="bulkOpen" data-bulk-id="${esc(doc.id)}">${esc(t('Obrir'))}</button>${withActions?`<button type="button" class="btn primary" data-act="bulkDownload" data-bulk-id="${esc(doc.id)}">${esc(t('Descarregar'))}</button>`:''}</div></article>`;
          }).join('')}</div></div>`;
        }).join('');
        const pageHeading=withActions&&pageKey?`<div class="v32-page-group-heading"><strong>${esc(t(pageLabel(pageKey==='pendent'?'':pageKey)))}</strong><span>${pageDocs.length} ${esc(t('documents'))}</span></div>`:'';
        return `${pageHeading}${monthHtml}`;
      }).join('');
      return `<section class="v31-classification-group"><div class="v31-classification-heading"><h3>${esc(t(cat.label))}</h3><span>${catDocs.length} ${esc(t('documents'))}</span></div>${pageHtml}</section>`;
    }).join('');
  }

  function v32FilterSummary(docs, month='', category='', status='', pageCount=''){
    const scoped=v32ScopedDocs(docs,month,category,status,pageCount);
    const phrases=[];if(category)phrases.push(bulkCategoryLabel(category));if(pageCount)phrases.push(pageLabel(pageCount==='pendent'?'':pageCount));if(month)phrases.push(monthLabelFromKey(month));if(status)phrases.push(v31StatusLabel(status));
    const suffix=phrases.length?' · '+esc(phrases.join(' · ')):'';return `${scoped.length} ${t('documents').toLowerCase()}${suffix}`;
  }

  renderBulkMineList = async function(){
    const companyId=state.profile?.company_id;if(!companyId)return;
    const docs=await loadBulkDocuments(companyId);const box=$('#bulkMineList');if(!box)return;
    if(!state.bulkMineFilters)state.bulkMineFilters=Object.create(null);
    const saved=state.bulkMineFilters[companyId]||{};
    /* The customer only needs the document-classification filter. Page-count,
       month and status remain available to the manager but are not customer filters. */
    const month='';const category=saved.category??box.dataset.category??'';const status='';const pageCount='';
    state.bulkMineFilters[companyId]={month,category,status,pageCount};box.dataset.month=month;box.dataset.category=category;box.dataset.status=status;box.dataset.pageCount=pageCount;
    box.innerHTML=`${v32CategoryOverview(docs,category,'',false)}<div class="filters bulk-filters v31-document-filters v32-document-filters v34-customer-document-filters"><label class="field"><span>${esc(t('Classificació del document'))}</span><select id="bulkMineCategory">${bulkCategoryFilterOptions(category)}</select></label></div><div class="bulk-period-note">${v32FilterSummary(docs,'',category,'','')}</div><section class="v31-document-details"><div class="v31-section-heading"><h3>${esc(t('Detall dels documents'))}</h3></div><div class="v31-document-groups">${v32DocumentGroupsHtml(docs,'',category,'','',false)}</div></section>`;
    state.bulkDocuments=docs;applyLanguage(box);

  renderManagerBulk = async function(company){
    const content=$('#managerContent');if(!content||!company)return;setupBulkRealtime(company.id);
    if(!state.bulkManagerFilters)state.bulkManagerFilters=Object.create(null);
    const docs=await loadBulkDocuments(company.id);const saved=state.bulkManagerFilters[company.id]||{};
    const month=saved.month??'';const category=saved.category??'';const status=['uploaded','received'].includes(saved.status)?saved.status:'';const pageCount=['una_pagina','varias_paginas','pendent'].includes(saved.pageCount)?saved.pageCount:'';
    state.bulkManagerFilters[company.id]={month,category,status,pageCount};
    content.innerHTML=`<section class="hero manager-mode-card v32-centered-manager"><div class="v32-centered-inner"><div class="eyebrow">${esc(t('Visió 2 · Càrrega documental'))}</div><h2>${esc(t('Documents pujats i recepcionats'))}</h2><p>${esc(t('El client puja i classifica els documents; pots filtrar-los per tipus i descarregar-los quan els processis.'))}</p><div id="bulkManagerDashboard"></div></div></section>`;
    const box=$('#bulkManagerDashboard');if(!box)return;box.dataset.month=month;box.dataset.category=category;box.dataset.status=status;box.dataset.pageCount=pageCount;
    box.innerHTML=`${v32CategoryOverview(docs,category,pageCount)}<div class="filters bulk-filters v31-document-filters v32-document-filters"><label class="field"><span>${esc(t('Mes de pujada'))}</span><select id="bulkManagerMonth">${bulkMonthOptions(docs,month)}</select></label><label class="field"><span>${esc(t('Classificació del document'))}</span><select id="bulkManagerCategory">${bulkCategoryFilterOptions(category)}</select></label><label class="field"><span>${esc(t('Classificació de pàgines'))}</span><select id="bulkManagerPageCount">${v32FilterPageOptions(pageCount)}</select></label><label class="field"><span>${esc(t('Estat del document'))}</span><select id="bulkManagerStatus">${v27StatusOptions(status)}</select></label><div class="field v31-zip-field"><span>&nbsp;</span><button type="button" class="btn primary" data-act="bulkZip" data-month="${esc(month)}" data-category="${esc(category)}" data-status="${esc(status)}">${esc(t('Descarregar visibles en ZIP'))}</button></div></div><div class="bulk-period-note">${v32FilterSummary(docs,month,category,status,pageCount)}</div><section class="v31-document-details"><div class="v31-section-heading"><h3>${esc(t('Detall dels documents'))}</h3></div><div class="v31-document-groups">${v32DocumentGroupsHtml(docs,month,category,status,pageCount,true)}</div></section>`;
    state.bulkDocuments=docs;applyLanguage(content);
  };

  /* Shortcuts for the one-page / multiple-page subfilters embedded in each invoice category. */
  document.addEventListener('click',e=>{
    const chip=e.target.closest?.('[data-act="bulkPageJump"]');if(!chip)return;
    e.preventDefault();e.stopImmediatePropagation();const category=chip.dataset.category||'';const pageCount=chip.dataset.pageCount||'';

      const company=currentManagerCompany();if(!company)return;const prior=state.bulkManagerFilters?.[company.id]||{};
      state.bulkManagerFilters[company.id]={month:$('#bulkManagerMonth')?.value??prior.month??'',category,pageCount:prior.category===category&&prior.pageCount===pageCount?'':pageCount,status:$('#bulkManagerStatus')?.value??prior.status??''};

      state.bulkMineFilters[companyId]={month:$('#bulkMineMonth')?.value??prior.month??'',category,pageCount:prior.category===category&&prior.pageCount===pageCount?'':pageCount,status:$('#bulkMineStatus')?.value??prior.status??''};

  downloadAllBulkDocuments = async function(companyId,companyName,month='',category='',status){
    const saved=state.bulkManagerFilters?.[companyId]||{};if(status===undefined)status=saved.status||'';
    const pageCount=saved.pageCount||'';const allDocs=await loadBulkDocuments(companyId);
    const docs=v32ScopedDocs(allDocs,month,category,status,pageCount);
    if(!docs.length){toast(t('No hi ha documents amb aquests filtres.'),true);return;}
    v27ShowDownloadConfirmation({kind:'zip',companyId,companyName,docs,docIds:docs.map(d=>d.id)});
  };

  async function v32PerformZipDownload(action,confirmReceived){
    if(!window.JSZip){toast(t('JSZip no està disponible.'),true);return;}
    try{
      const zip=new JSZip();let i=0;
      const ordered=[...action.docs].sort((a,b)=>{
        const ca=normalizeBulkCategory(a.document_category),cb=normalizeBulkCategory(b.document_category);
        return invoiceCategoryRank(ca)-invoiceCategoryRank(cb)||String(a.page_count||'').localeCompare(String(b.page_count||''))||String(a.file_name||'').localeCompare(String(b.file_name||''));
      });
      for(const doc of ordered){
        const {data,error}=await sb.storage.from('invoices').createSignedUrl(doc.file_path,240);
        if(error||!data?.signedUrl)throw error||new Error(`${doc.file_name}: ${t('No s’ha pogut descarregar el document.')}`);
        const response=await fetch(data.signedUrl);if(!response.ok)throw new Error(`${doc.file_name}: HTTP ${response.status}`);
        const category=normalizeBulkCategory(doc.document_category);
        const categoryLabel=BULK_DOCUMENT_CATEGORIES.find(c=>c.value===category)?.label||'Altres';
        const categoryFolder=`${String(invoiceCategoryRank(category)).padStart(2,'0')} - ${safeName(t(categoryLabel))}`;
        const pageFolder=`${pageFolderLabel(normalizePageCount(doc.page_count)?doc.page_count:'pendent')}`;
        const path=[categoryFolder,pageFolder,safeName(doc.file_name)].filter(Boolean).join('/');
        zip.file(path,await response.blob());i++;
      }
      const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
      await v27DownloadBlob(blob,`documents_${safeName(action.companyName||'empresa')}_${new Date().toISOString().slice(0,10)}.zip`);
      if(confirmReceived){try{await v31RecordReceipt(action.docIds);toast(t('Recepció confirmada'));await v27RefreshBulkStatuses(action.companyId);}catch(err){toast(t('Els documents s’han descarregat però no s’ha pogut confirmar la recepció.'),true);console.error(err);}}
      else toast(`${i} ${t('documents descarregats en ZIP')}`);
    }catch(error){toast(error.message||t('No s’ha pogut descarregar el paquet ZIP.'),true);}
  }
  v27PerformZipDownload=v32PerformZipDownload;

<script id="v35-ux-installer">
(()=>{const sheet=document.createElement("style");sheet.id="v35-ux-refresh";sheet.textContent=String.raw`
/* v35 — visual refresh only; preserves the existing application logic */
:root {
  --paper:#f3f7f8;
  --surface:#ffffff;
  --ink:#182d3d;
  --ink2:#647887;
  --line:#dbe5e9;
  --brand:#126b72;
  --brand-dark:#0a4e55;
  --brand-ink:#ffffff;
  --brand-soft:#e5f3f3;
  --mark:#fff0b8;
  --warn:#85540a;
  --warn-bg:#fff4d8;
  --ok:#14684c;
  --ok-bg:#e3f6ed;
  --bad:#a33333;
  --bad-bg:#ffebea;
  --backdrop:rgba(17,35,48,.52);
  --v35-radius:20px;
  --v35-radius-sm:13px;
  --v35-shadow:0 12px 32px rgba(23,49,63,.065);
  --v35-shadow-hover:0 18px 42px rgba(23,49,63,.105);
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --paper:#0d151c;
    --surface:#15212a;
    --ink:#e8f0f4;
    --ink2:#a0b2bd;
    --line:#2b3d48;
    --brand:#72cfca;
    --brand-dark:#42aaa8;
    --brand-ink:#092326;
    --brand-soft:#1a3739;
    --mark:#62551e;
    --warn:#f2ca79;
    --warn-bg:#3b3019;
    --ok:#8bdfb8;
    --ok-bg:#183a30;
    --bad:#ffaaa4;
    --bad-bg:#452323;
    --backdrop:rgba(0,0,0,.7);
    --v35-shadow:0 14px 36px rgba(0,0,0,.22);
    --v35-shadow-hover:0 18px 44px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"] {
  --paper:#0d151c;
  --surface:#15212a;
  --ink:#e8f0f4;
  --ink2:#a0b2bd;
  --line:#2b3d48;
  --brand:#72cfca;
  --brand-dark:#42aaa8;
  --brand-ink:#092326;
  --brand-soft:#1a3739;
  --mark:#62551e;
  --warn:#f2ca79;
  --warn-bg:#3b3019;
  --ok:#8bdfb8;
  --ok-bg:#183a30;
  --bad:#ffaaa4;
  --bad-bg:#452323;
  --backdrop:rgba(0,0,0,.7);
  --v35-shadow:0 14px 36px rgba(0,0,0,.22);
  --v35-shadow-hover:0 18px 44px rgba(0,0,0,.32);
}
* { box-sizing:border-box; }
html { background:var(--paper); scroll-behavior:smooth; }
body {
  background:radial-gradient(ellipse at 4% 0%, color-mix(in srgb,var(--brand) 6%,transparent), transparent 32%), var(--paper);
  color:var(--ink);
  font-family:"Instrument Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.55;
  letter-spacing:.005em;
}
button,input,select,textarea { font:inherit; }
::selection { background:var(--brand-soft); color:var(--ink); }
:focus-visible { outline:3px solid color-mix(in srgb,var(--brand) 75%,white); outline-offset:3px; }
a { color:var(--brand); }

/* Header: calmer brand area and clearer controls */
.top {
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  border-bottom:1px solid var(--line);
  box-shadow:0 5px 24px rgba(17,44,56,.045);
  backdrop-filter:blur(14px);
}
.top-in { max-width:1280px; min-height:78px; padding:13px 26px; gap:20px; }
.brand-wrap { min-width:0; gap:13px; }
.brand-mark {
  width:46px; height:46px; flex:0 0 46px; border-radius:15px;
  background:linear-gradient(145deg,var(--brand),var(--brand-dark));
  box-shadow:0 7px 18px color-mix(in srgb,var(--brand) 21%,transparent);
}
.brand-main { font-size:1.12rem; letter-spacing:-.035em; }
.brand-sub { margin-top:4px; font-size:.76rem; }
.header-actions { gap:12px; }
.lang-switch,.who {
  border:1px solid var(--line); border-radius:999px; background:var(--surface);
  padding:5px 9px; box-shadow:0 2px 6px rgba(16,40,52,.025);
}
.lang-switch select { min-height:34px; border:0; background:transparent; font-size:.85rem; font-weight:600; }
.who { padding:6px 10px; }
.who-name strong { font-weight:700; letter-spacing:-.01em; }
.role-chip { background:var(--brand-soft); color:var(--brand-dark); border:1px solid color-mix(in srgb,var(--brand) 15%,transparent); }
.tabs { gap:6px; padding:5px; border:1px solid var(--line); border-radius:999px; background:var(--paper); }
.tab { border-radius:999px; padding:9px 14px; font-weight:650; transition:background .16s ease,color .16s ease,box-shadow .16s ease; }
.tab[aria-pressed="true"] { box-shadow:0 3px 10px color-mix(in srgb,var(--brand) 16%,transparent); }

/* Global page grid: every main block shares a common center line */
.wrap { width:100%; max-width:1280px; margin-inline:auto; padding:32px 26px 76px; }
#view > section { width:100%; margin-inline:auto; }
#capture,#history,#bulkCompany { max-width:1160px; }
#managerContent,#pnl,#summary,#tbl { width:100%; max-width:1160px; margin-inline:auto; }
.wrap > .manager-welcome,.wrap > .manager-company-grid,.wrap > .manager-selected-head,
.wrap > .manager-mode-card,.wrap > .filters,.wrap > .summary,.wrap > .bar,
.wrap > .tablewrap,.wrap > .pnl,.wrap > .expense-card { max-width:1160px; margin-inline:auto; }
.wrap :is(.hero,.work,.filters,.list,.pnl,.tablewrap,.expense-card,.manager-company-card,.manager-selected-head,.manager-mode-card,.v31-category-overview,.v31-document-details) {
  border-radius:var(--v35-radius);
}
.hero,.login,.work,.filters,.list,.pnl,.tablewrap,.expense-card,.manager-company-card,.manager-selected-head,.manager-mode-card,.v31-category-overview,.v31-document-details {
  border-color:var(--line);
  box-shadow:var(--v35-shadow);
}
.hero { padding:clamp(24px,3.2vw,36px); margin-inline:auto; }
.hero h1,.hero h2,.login h1 { letter-spacing:-.04em; line-height:1.12; }
.hero h1 { font-size:clamp(1.75rem,3vw,2.55rem); }
.hero h2 { font-size:clamp(1.5rem,2.4vw,2.05rem); }
.hero p { max-width:68ch; line-height:1.7; }
.hero .corporate-label { border:1px solid color-mix(in srgb,var(--brand) 13%,transparent); background:var(--brand-soft); color:var(--brand-dark); }
.eyebrow { margin-bottom:9px; font-size:.7rem; letter-spacing:.14em; }
.login { width:min(100%,560px); margin:clamp(28px,7vh,76px) auto; padding:clamp(24px,4vw,42px); border:1px solid var(--line); border-radius:26px; }
.login h1 { text-align:center; max-width:15ch; margin-inline:auto; font-size:clamp(2rem,3.8vw,2.75rem); }
.login p { text-align:center; max-width:46ch; margin:12px auto 22px; }
.login .receipt { opacity:.8; }

/* Typography and common surfaces */
h1,h2,h3 { color:var(--ink); letter-spacing:-.035em; }
h1 { font-size:clamp(1.8rem,3vw,2.5rem); }
h2 { font-size:clamp(1.35rem,2.2vw,1.85rem); }
h3 { font-size:1.1rem; }
.sub,.meta,.vision-note,.bulk-period-note,.manager-company-meta { color:var(--ink2); }
.section-head { justify-content:center; text-align:center; flex-wrap:wrap; gap:9px 14px; margin:28px auto 15px; }
.section-head h2 { font-size:clamp(1.4rem,2.25vw,1.9rem); }
.section-head span { padding:4px 10px; border-radius:999px; background:var(--brand-soft); color:var(--brand-dark); font-weight:700; font-size:.78rem; }
.v31-section-heading { justify-content:center; align-items:center; flex-direction:column; text-align:center; gap:5px; margin-bottom:17px; }
.v31-section-heading h3 { font-size:1.15rem; letter-spacing:-.025em; }
.v31-section-heading p { max-width:60ch; margin-inline:auto; line-height:1.55; }

/* Buttons with a consistent hierarchy */
.btn {
  min-height:44px; padding:10px 16px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface); color:var(--ink); font-weight:650; letter-spacing:0;
  box-shadow:0 2px 4px rgba(20,43,55,.025);
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease,filter .15s ease,background .15s ease;
}
.btn:hover:not([disabled]) { transform:translateY(-1px); border-color:color-mix(in srgb,var(--brand) 48%,var(--line)); box-shadow:0 7px 16px rgba(20,43,55,.08); }
.btn:active:not([disabled]) { transform:translateY(0); }
.btn.primary { border-color:var(--brand); background:linear-gradient(135deg,var(--brand),var(--brand-dark)); color:var(--brand-ink); box-shadow:0 6px 15px color-mix(in srgb,var(--brand) 19%,transparent); }
.btn.primary:hover:not([disabled]) { filter:brightness(1.04); box-shadow:0 9px 21px color-mix(in srgb,var(--brand) 24%,transparent); }
.btn.ghost { background:transparent; box-shadow:none; }
.btn.danger { background:var(--bad-bg); border-color:color-mix(in srgb,var(--bad) 20%,var(--line)); }
.btn[disabled],button[disabled] { opacity:.54; filter:saturate(.65); box-shadow:none; transform:none; cursor:not-allowed; }
.actions,.row-actions,.bulk-actions { gap:10px; align-items:center; }
.actions { justify-content:center; margin-top:20px; }

/* Forms: uniform rhythm, more contrast and bigger hit targets */
.fields { gap:17px; }
.field { min-width:0; }
.field>span { font-size:.79rem; font-weight:700; letter-spacing:.015em; color:var(--ink2); margin-bottom:7px; }
.field input,.field select,.field textarea,
input[type="search"],input[type="date"],input[type="email"],input[type="password"],input[type="text"],select,textarea {
  border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink);
}
.field input,.field select,.field textarea { min-height:47px; padding:11px 13px; }
.field textarea { min-height:92px; }
.field input:hover,.field select:hover,.field textarea:hover,select:hover { border-color:color-mix(in srgb,var(--brand) 40%,var(--line)); }
.field input:focus,.field select:focus,.field textarea:focus,select:focus,input:focus,textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 13%,transparent); }
.field input[readonly],.field select[disabled] { background:color-mix(in srgb,var(--paper) 65%,var(--surface)); }
::placeholder { color:color-mix(in srgb,var(--ink2) 75%,transparent); opacity:1; }
.notice,.empty { border-radius:14px; line-height:1.55; }
.notice { background:var(--warn-bg); color:var(--warn); border:1px solid color-mix(in srgb,var(--warn) 24%,var(--line)); padding:12px 15px; }
.notice.bad { background:var(--bad-bg); color:var(--bad); border-color:color-mix(in srgb,var(--bad) 25%,var(--line)); }
.err { font-weight:600; }

/* Mode selection cards */
.mode-grid { gap:16px; margin-top:20px; }
.mode-card { border-radius:18px; background:var(--surface); border-color:var(--line); padding:22px; box-shadow:0 5px 18px rgba(20,43,55,.035); }
.mode-card:hover { box-shadow:var(--v35-shadow-hover); }
.mode-card.primary-mode { background:linear-gradient(155deg,var(--surface),color-mix(in srgb,var(--brand-soft) 65%,var(--surface))); border-color:color-mix(in srgb,var(--brand) 27%,var(--line)); }
.mode-card h3 { font-size:1.14rem; }
.mode-card p { line-height:1.65; }
.mode-card .mode-action { display:flex; justify-content:center; margin-top:18px; }

/* Filters, count cards and tables line up on the same centered grid */
.filters { gap:15px; padding:19px; justify-content:center; margin:0 auto 18px; }
.filters .field { min-width:160px; flex:1 1 165px; }
.filters .field.grow { flex:2 1 240px; }
.history-filters { max-width:1120px; }
.summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:12px; max-width:1120px; margin:17px auto 19px; }
.summary>div { min-width:0; border:1px solid var(--line); border-radius:15px; background:var(--surface); padding:15px 17px; box-shadow:0 3px 10px rgba(23,49,63,.025); }
.summary strong { font-size:1.45rem; line-height:1.2; letter-spacing:-.03em; }
.bar { max-width:1120px; margin:23px auto 10px; gap:12px; align-items:center; }
.tablewrap,.pnl-table { overflow:auto; border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:var(--v35-shadow); }
table { border-collapse:separate; border-spacing:0; width:100%; }
th { background:color-mix(in srgb,var(--paper) 72%,var(--surface)); color:var(--ink2); font-size:.73rem; text-transform:uppercase; letter-spacing:.065em; font-weight:800; padding:13px 15px; }
td { padding:13px 15px; border-bottom:1px solid var(--line); font-size:.91rem; }
tbody tr:last-child td { border-bottom:0; }
tbody tr:hover td { background:color-mix(in srgb,var(--brand-soft) 44%,var(--surface)); }
.list { max-width:1120px; margin:0 auto; box-shadow:var(--v35-shadow); }
.list li+li { border-top:1px solid var(--line); }
.item { min-height:76px; padding:17px 20px; transition:background .14s ease; }
.item:hover { background:color-mix(in srgb,var(--brand-soft) 42%,var(--surface)); }
.item b { letter-spacing:-.01em; }
.item .amt strong { letter-spacing:-.025em; }
.empty { max-width:1120px; margin:16px auto; padding:34px 24px; text-align:center; background:var(--surface); border:1px dashed color-mix(in srgb,var(--brand) 28%,var(--line)); }
.chip { border-radius:999px; padding:5px 9px; font-size:.71rem; font-weight:800; letter-spacing:.015em; }

/* Vision 2 upload: clear steps, balanced panels and easy-to-scan categories */
.bulk-upload { width:100%; max-width:960px; margin:0 auto 26px; text-align:center; }
.bulk-upload .hero,.bulk-upload.hero { text-align:center; }
.bulk-upload>div>p,.bulk-upload>p { margin-left:auto; margin-right:auto; }
.bulk-upload h1,.manager-mode-card h2 { text-align:center; margin-inline:auto; }
.bulk-upload .eyebrow,.bulk-upload .corporate-label { margin-left:auto; margin-right:auto; }
.bulk-drop { width:100%; max-width:920px; margin:24px auto 0; padding:clamp(18px,3vw,30px); border:1.5px dashed color-mix(in srgb,var(--brand) 32%,var(--line)); border-radius:22px; background:color-mix(in srgb,var(--surface) 80%,var(--brand-soft)); text-align:center; }
.bulk-drop input[type=file] { width:100%; min-height:58px; padding:12px; border:1px solid var(--line); border-radius:14px; background:var(--surface); text-align:left; }
.bulk-classification-first { max-width:760px; margin:0 auto 20px; padding:20px; border:1px solid color-mix(in srgb,var(--brand) 18%,var(--line)); border-radius:17px; background:var(--brand-soft); }
.bulk-upload-category-field { width:100%; max-width:560px; margin:0 auto; text-align:left; }
.bulk-required-note { max-width:600px; margin:11px auto 0; padding:9px 12px; border-radius:11px; font-size:.86rem; font-weight:650; }
.bulk-required-note.is-required { color:var(--warn); background:var(--warn-bg); border:1px solid color-mix(in srgb,var(--warn) 22%,var(--line)); }
.bulk-pick-field { max-width:760px; margin:0 auto; text-align:left; }
.bulk-ticket-note,.vision-note { max-width:70ch; margin:12px auto; line-height:1.6; }
.bulk-queue-heading { margin:24px auto 11px; max-width:760px; text-align:center; font-size:.82rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); }
.bulk-actions { justify-content:center; margin:16px auto 0; }
.bulk-summary { max-width:1120px; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin:20px auto 24px; }
.bulk-stat { border:1px solid var(--line); border-radius:17px; padding:18px; background:var(--surface); box-shadow:0 4px 14px rgba(23,49,63,.035); text-align:center; }
.bulk-stat span { line-height:1.4; min-height:2.2em; }
.bulk-stat strong { font-size:1.65rem; font-variant-numeric:tabular-nums; letter-spacing:-.04em; }
.bulk-stat small { line-height:1.45; }
.bulk-filters { max-width:1120px; margin:18px auto; }
.bulk-period-note { max-width:1120px; margin:10px auto 18px; text-align:center; font-size:.87rem; }
.bulk-months,.v31-document-groups { max-width:1120px; margin-inline:auto; }
.bulk-month-group { margin:17px auto; }
.bulk-month-head,.v31-classification-heading,.v31-month-heading { justify-content:center; text-align:center; flex-wrap:wrap; gap:8px 12px; padding:15px 18px; background:color-mix(in srgb,var(--brand-soft) 52%,var(--surface)); }
.bulk-row { padding:15px 17px; border:1px solid var(--line); border-radius:15px; background:var(--surface); box-shadow:0 3px 12px rgba(23,49,63,.025); }
.bulk-row + .bulk-row { margin-top:9px; }
.bulk-row:hover { border-color:color-mix(in srgb,var(--brand) 33%,var(--line)); box-shadow:0 9px 20px rgba(23,49,63,.065); }
.bulk-file-open b { line-height:1.45; text-decoration-thickness:1px; text-underline-offset:4px; }
.bulk-file-open small,.bulk-row small { line-height:1.5; }
.bulk-row-actions { gap:8px; }
.bulk-row-actions .btn { min-height:38px; padding:8px 12px; border-radius:10px; }

/* Classification overview and document groups */
.v31-category-overview { max-width:1120px; margin:0 auto 20px; padding:22px; border:1px solid var(--line); background:var(--surface); }
.v31-category-grid,.v32-category-grid { grid-template-columns:repeat(5,minmax(0,1fr)); gap:13px; }
.v31-category-card {
  position:relative; min-height:126px; padding:17px 13px; border-radius:17px; border-color:var(--line);
  background:var(--paper); align-items:center; justify-content:center; text-align:center;
  box-shadow:0 3px 10px rgba(23,49,63,.025);
}
.v31-category-card:hover { border-color:var(--brand); box-shadow:0 10px 24px color-mix(in srgb,var(--brand) 11%,transparent); }
.v31-category-card.is-active { border-color:var(--brand); background:var(--brand-soft); box-shadow:inset 0 0 0 1px var(--brand),0 9px 20px color-mix(in srgb,var(--brand) 10%,transparent); }
.v31-category-name { line-height:1.35; font-weight:750; }
.v31-category-card strong { font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:1.75rem; line-height:1.05; letter-spacing:-.04em; }
.v31-category-card small { color:var(--ink2); font-size:.75rem; }
.v32-category-card-wrap { border:1px solid var(--line); border-radius:17px; background:var(--surface); padding:7px; }
.v32-category-card-wrap .v31-category-card { width:100%; height:100%; }
.v32-page-filter-chip,.v32-page-pill { border-radius:999px; transition:all .15s ease; }
.v31-document-details { max-width:1120px; margin:24px auto 0; padding:22px; border:1px solid var(--line); background:var(--surface); }
.v31-document-groups { display:flex; flex-direction:column; gap:16px; }
.v31-classification-group { border:1px solid var(--line); border-radius:17px; overflow:hidden; background:var(--surface); box-shadow:0 3px 12px rgba(23,49,63,.025); }
.v31-classification-heading { border-bottom:1px solid var(--line); }
.v31-classification-heading h3 { font-size:1.02rem; }
.v31-document-row { border-radius:0; border-width:0 0 1px; box-shadow:none; padding:16px 18px; }
.v31-document-row:last-child { border-bottom:0; }
.v31-document-row:hover { box-shadow:none; background:color-mix(in srgb,var(--brand-soft) 30%,var(--surface)); }
.v31-state-chip { padding:5px 10px; font-size:.72rem; }
.v31-state-chip.is-uploaded { background:var(--warn-bg); border-color:color-mix(in srgb,var(--warn) 27%,var(--line)); color:var(--warn); }
.v31-state-chip.is-received { background:var(--ok-bg); border-color:color-mix(in srgb,var(--ok) 25%,var(--line)); color:var(--ok); }
.v31-document-title { gap:10px; }
.v31-document-title .bulk-file-open b { font-weight:750; }
.v34-customer-document-filters { max-width:540px; width:100%; margin:0 auto 15px; padding:14px 18px; }
.v34-customer-document-filters .field { max-width:460px; }
.v32-centered-inner { margin-inline:auto; }
.v32-centered-manager { max-width:1120px; margin:0 auto 24px; }
.v32-centered-manager .v32-centered-inner { text-align:center; }
.v32-centered-inner>p { max-width:70ch; margin-left:auto; margin-right:auto; }

/* Manager workspace and contact-party management */
.manager-welcome { max-width:1120px; margin:0 auto 22px; border-radius:22px; padding:clamp(22px,3vw,32px); text-align:center; justify-content:center; background:linear-gradient(125deg,#0d5e65,#0a424b); box-shadow:0 16px 36px rgba(10,77,84,.19); }
.manager-welcome>div { max-width:780px; }
.manager-welcome .manager-badge { flex:0 0 48px; }
.manager-company-grid { max-width:1120px; margin:18px auto 26px; gap:16px; }
.manager-company-card { border-radius:19px; padding:23px; transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease; }
.manager-company-card:hover { transform:translateY(-2px); box-shadow:var(--v35-shadow-hover); }
.manager-company-name { letter-spacing:-.02em; }
.manager-selected-head { padding:19px 22px; border-radius:18px; }
.manager-mode-card { max-width:1120px; margin:0 auto 20px; text-align:center; }
.manager-mode-card>div { max-width:100%; margin-inline:auto; }
.manager-mode-card p { margin-left:auto; margin-right:auto; }
.manager-mode-badge { border-radius:999px; padding:6px 10px; font-weight:750; }
.v22-counterparty,.v22-partner-form,.v22-partner-table { border-radius:17px; }
.v22-partner-form { padding:22px; }
.v22-partner-table { overflow:auto; }
.partner-toolbar { justify-content:center; flex-wrap:wrap; gap:12px; }
.v22-counterparty { max-width:1120px; margin-inline:auto; }

/* Dialogs and footer */
dialog { border:1px solid var(--line); border-radius:24px; box-shadow:0 28px 90px rgba(0,0,0,.22); }
.dpad { padding:clamp(20px,3vw,32px); }
.dhead { align-items:center; padding-bottom:13px; border-bottom:1px solid var(--line); }
.dhead h2 { letter-spacing:-.035em; }
.dgrid { gap:24px; }
#toast { border-radius:14px; padding:13px 18px; font-weight:700; box-shadow:0 14px 32px rgba(0,0,0,.17); }
.footer-brand { max-width:1160px; margin:18px auto 0; padding:0 24px 30px; text-align:center; }
.footer-contact { justify-content:center; gap:8px 18px; line-height:1.5; }
.footer-contact a { padding:3px 0; }

/* Explicit dark-mode tuning for styles that originally used fixed light colors */
:root[data-theme="dark"] .hero,
:root[data-theme="dark"] .login,
:root[data-theme="dark"] .work,
