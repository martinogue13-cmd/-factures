<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="pageTitle">Joan Nogue · Bústia de factures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#f2f4f7; --surface:#ffffff; --ink:#14213d; --ink2:#55627a; --line:#d8dee8;
  --brand:#0d5c63; --brand-ink:#ffffff; --mark:#ffe58a;
  --warn:#8a5200; --warn-bg:#fff1d6; --ok:#0b6b45; --ok-bg:#d9f2e6; --bad:#a32a2a; --bad-bg:#fde3e1;
  --backdrop:rgba(20,33,61,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f141d; --surface:#171e2b; --ink:#e8edf5; --ink2:#9aa7bd; --line:#2a3446;
    --brand:#4fb7bd; --brand-ink:#06232a; --mark:#6b5a12;
    --warn:#f1c36b; --warn-bg:#3a2d0f; --ok:#6fd6a4; --ok-bg:#12372a; --bad:#ff9b94; --bad-bg:#431a19;
    --backdrop:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0f141d; --surface:#171e2b; --ink:#e8edf5; --ink2:#9aa7bd; --line:#2a3446;
  --brand:#4fb7bd; --brand-ink:#06232a; --mark:#6b5a12;
  --warn:#f1c36b; --warn-bg:#3a2d0f; --ok:#6fd6a4; --ok-bg:#12372a; --bad:#ff9b94; --bad-bg:#431a19;
  --backdrop:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
/* Identitat corporativa Joan Nogue */
:root{--brand:#0b5961;--brand-dark:#083d43;--brand-soft:#e9f4f4;--ink:#10243a;--ink2:#617083}
.top{box-shadow:0 2px 16px rgba(16,36,58,.05)}
.top-in{min-height:72px;padding:12px 20px}
.brand-wrap{display:flex;align-items:center;gap:12px;min-width:240px}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,var(--brand),var(--brand-dark));color:#fff;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;letter-spacing:.04em;box-shadow:0 7px 16px rgba(11,89,97,.18)}
.brand-copy{display:flex;flex-direction:column;gap:1px}
.brand-main{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.08rem;line-height:1.1}
.brand-sub{font-size:.74rem;color:var(--ink2);letter-spacing:.02em}
.who{gap:10px}
.who-name{display:flex;flex-direction:column;gap:0;line-height:1.15}
.who-name strong{font-size:.92rem;color:var(--ink)}
.who-name span{font-size:.74rem;color:var(--ink2)}
.role-chip{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-dark);font-size:.72rem;font-weight:700}
.login{position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(16,36,58,.07)}
.login::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--brand-dark),var(--brand),#75b6b9)}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:700;color:var(--brand);margin-bottom:8px}
.login h1{max-width:12ch}
.hero{box-shadow:0 14px 34px rgba(16,36,58,.045)}
.hero .corporate-label{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-dark);font-size:.75rem;font-weight:700;margin-bottom:10px}
.mode-card{box-shadow:0 8px 20px rgba(16,36,58,.035)}
.mode-card.primary-mode{border-color:rgba(11,89,97,.26);background:linear-gradient(180deg,#f9ffff,#fff)}
.section-head{margin-top:34px}
.manager-welcome{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(135deg,#0b5961,#083d43);color:#fff;border-radius:16px;padding:18px 20px;margin:0 0 18px;box-shadow:0 14px 34px rgba(11,89,97,.16)}
.manager-welcome .eyebrow{color:#bfe1e3;margin-bottom:3px}
.manager-welcome h2{font-size:1.25rem}
.manager-welcome p{margin:4px 0 0;color:#d8ecee;font-size:.9rem}
.manager-badge{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);font-weight:700;letter-spacing:.04em}
.footer-brand{max-width:1120px;margin:8px auto 0;padding:0 16px 26px;color:var(--ink2);font-size:.76rem}
.footer-contact{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;opacity:.92}
.footer-contact strong{color:var(--ink);font-weight:600}
.footer-contact span{color:var(--ink2)}
.footer-contact a{color:var(--ink2);text-decoration:none}
.footer-contact a:hover{color:var(--brand);text-decoration:underline}
@media (max-width:760px){.brand-sub{display:none}.top-in{padding:10px 14px}.who-name{display:none}.role-chip{display:none}.manager-welcome{align-items:flex-start}}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;letter-spacing:-.015em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.15rem}
.brand svg{width:24px;height:24px;color:var(--brand)}
.tabs{display:flex;gap:4px;background:var(--paper);padding:3px;border-radius:11px;border:1px solid var(--line)}
.tabs[hidden]{display:none !important}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink2)}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs[hidden]{display:none !important}

.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang-switch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 8px;color:var(--ink2)}
.lang-globe{font-size:.95rem;line-height:1}
.lang-switch select{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer;padding:4px 2px;outline:none}
.lang-switch select:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.who{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--ink2)}
.who b{color:var(--ink);font-weight:600}
.who .btn{min-height:36px;padding:6px 12px}
.login{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;max-width:920px;margin:18px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px}
.login h1{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.1;font-weight:700;margin-bottom:10px}
.login p{color:var(--ink2);margin:0 0 16px}
.login .receipt{max-width:150px;margin:8px 0 0}
.login .fields{grid-template-columns:1fr}
.fname{color:var(--ink2);font-size:.88rem;margin:8px 0 0;overflow-wrap:anywhere}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 72px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.row-actions{display:flex;flex-wrap:wrap;gap:10px}

.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px}
.hero h1{font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.08;font-weight:700;margin-bottom:10px}
.hero p{margin:0 0 20px;color:var(--ink2);max-width:46ch}
.hero.drag{border-color:var(--brand);box-shadow:0 0 0 3px var(--mark)}
.receipt{width:100%;max-width:220px;justify-self:center;color:var(--ink)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:.95rem}
.notice.bad{background:var(--bad-bg);color:var(--bad)}

.work{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.imgwrap{position:relative;border-radius:12px;overflow:hidden;background:var(--paper);border:1px solid var(--line);min-height:120px;display:grid;place-items:center;color:var(--ink2)}
.imgwrap img{display:block;width:100%;max-height:72vh;object-fit:contain}
.scan{position:absolute;left:0;right:0;top:0;height:3px;background:var(--brand);box-shadow:0 0 22px 8px var(--mark);animation:sweep 1.7s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 3px)}}
.work h2{font-size:1.35rem;margin-bottom:4px}
.sub{color:var(--ink2);margin:0 0 14px;font-size:.95rem}
.skeleton{display:grid;gap:12px;margin:18px 0}
.skeleton i{display:block;height:44px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.skeleton i:nth-child(odd){width:100%}.skeleton i:nth-child(even){width:70%}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:block}
.field.wide{grid-column:1/-1}
.field>span{display:block;font-size:.82rem;font-weight:500;color:var(--ink2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background-color:var(--surface);min-height:44px}
.field textarea{min-height:76px;resize:vertical}
.field input[readonly],.field select[disabled]{background-color:var(--paper)}
.field.ai input{background-image:linear-gradient(to top,var(--mark) 0 40%,transparent 40%);background-repeat:no-repeat;background-size:100% 100%}
.field.miss input{border-color:var(--warn);background-color:var(--warn-bg)}
.field.miss em{font-style:normal;color:var(--warn);font-size:.78rem}
.fresh .field{animation:rise .4s ease-out both;animation-delay:calc(var(--i)*70ms)}
.fresh .field.ai input{animation:mark .7s ease-out both;animation-delay:calc(var(--i)*70ms + 200ms)}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
@keyframes mark{from{background-size:0% 100%}}
.err{color:var(--bad);margin:10px 0 0;min-height:1.4em;font-size:.95rem}
.warn-sum{color:var(--warn);font-size:.9rem;margin:10px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.section-head h2{font-size:1.4rem}
.section-head span{color:var(--ink2);font-size:.95rem}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;background:transparent;border:0;padding:14px 16px;cursor:pointer}
.item:hover{background:var(--paper)}
.item b{display:block;font-weight:600}
.item small{color:var(--ink2);font-size:.88rem}
.item .amt{text-align:right;white-space:nowrap}
.item .amt strong{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.15rem;font-variant-numeric:tabular-nums}
.empty{padding:28px 18px;color:var(--ink2);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px}
.chip.pendiente{background:var(--warn-bg);color:var(--warn)}
.chip.revisada{background:var(--ok-bg);color:var(--ok)}


.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.mode-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.mode-card:hover{transform:translateY(-1px);border-color:var(--brand);box-shadow:0 8px 20px rgba(20,33,61,.08)}
.mode-card h3{font-size:1.1rem;margin:0 0 6px}
.mode-card p{margin:0;color:var(--ink2);font-size:.92rem}
.mode-card .mode-action{margin-top:12px}
@media (max-width:760px){.mode-grid{grid-template-columns:1fr}}
.history-filters{margin-top:10px;margin-bottom:16px}.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.filters .field{min-width:150px;flex:1 1 150px}
.filters .field.grow{flex:2 1 220px}
.summary{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;margin:16px 2px}
.summary div{font-size:.9rem;color:var(--ink2)}
.summary strong{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.4rem;color:var(--ink);font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin:20px 0 4px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:980px}
th{text-align:left;font-weight:600;font-size:.84rem;color:var(--ink2);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--paper)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small{display:block;color:var(--ink2)}

dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(980px,calc(100vw - 20px));max-height:calc(100vh - 20px);overflow:auto}
dialog::backdrop{background:var(--backdrop)}
.dpad{padding:20px}
.dhead{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:14px}
.dhead h2{font-size:1.4rem}
.dgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px}
.meta{color:var(--ink2);font-size:.88rem;margin:14px 0 0}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:12px;max-width:min(92vw,520px);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#toast.bad{background:var(--bad);color:#fff}

@media (max-width:760px){
  .login{grid-template-columns:1fr;padding:22px}
  .hero{grid-template-columns:1fr;padding:22px}
  .receipt{display:none}
  .work,.dgrid{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){.fields{grid-template-columns:1fr}}

/* ---------- Responsive mobile ---------- */
@media (max-width:900px){
  .top-in{padding:10px 14px}
  .wrap{padding:16px 14px 56px}
  .login{max-width:100%;gap:22px;padding:24px}
  .hero{padding:24px}
  .work{gap:16px;padding:16px}
  .dgrid{gap:16px}
}

@media (max-width:760px){
  .top-in{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:
      "brand actions"
      "tabs tabs";
    align-items:center;
    gap:8px 10px;
    min-height:auto;
  }
  .brand-wrap{grid-area:brand;min-width:0;gap:9px}
  .brand-mark{width:38px;height:38px;border-radius:10px;font-size:.9rem}
  .brand-main{font-size:1rem}
  .brand-sub{display:none}
  .header-actions{grid-area:actions;min-width:0;justify-content:flex-end;gap:7px}
  .tabs{grid-area:tabs;width:100%;overflow-x:auto;justify-content:stretch}
  .tab{flex:1 0 auto;min-width:0;padding:8px 10px;font-size:.86rem;white-space:nowrap}
  .lang-switch{padding:3px 6px;gap:4px}
  .lang-switch select{font-size:.82rem;padding:3px 0}
  .lang-globe{font-size:.9rem}
  .who{gap:6px}
  .who-name{display:none}
  .role-chip{display:none}
  .who .btn{min-height:38px;padding:7px 10px}

  .wrap{padding:14px 12px 46px}
  .login{grid-template-columns:1fr;padding:20px;margin-top:10px;border-radius:15px;gap:14px}
  .login h1{max-width:none;font-size:clamp(1.6rem,8vw,2rem)}
  .login .receipt{display:none}
  .hero{grid-template-columns:1fr;padding:20px;border-radius:15px;gap:12px}
  .hero .receipt{display:none}
  .work{grid-template-columns:1fr;border-radius:15px;padding:14px}
  .work .imgwrap{min-height:180px}
  .dgrid{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .field.wide{grid-column:auto}
  .mode-grid{grid-template-columns:1fr;gap:12px}
  .mode-card{padding:16px}
  .mode-card .mode-action .btn{width:100%}

  .section-head{margin:24px 0 10px;align-items:flex-start}
  .section-head h2{font-size:1.25rem}
  .history-filters{margin-top:8px}
  .filters{display:grid;grid-template-columns:1fr;gap:10px;padding:12px}
  .filters .field,.filters .field.grow{min-width:0;width:100%;flex:none}
  .filters .field input,.filters .field select{width:100%}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .summary strong{font-size:1.15rem}
  .bar{align-items:stretch;gap:8px}
  .bar .row-actions,.bar .row-actions .btn{width:100%}

  .list{border-radius:12px}
  .item{padding:13px 12px;align-items:flex-start}
  .item .amt{min-width:78px}
  .item .amt strong{font-size:1rem}

  .tablewrap{border-radius:12px;-webkit-overflow-scrolling:touch}
  table{min-width:900px}
  th{padding:9px 10px}
  td{padding:9px 10px}

  dialog{width:calc(100vw - 12px);max-height:calc(100dvh - 12px);border-radius:14px}
  .dpad{padding:14px}
  .dhead{align-items:center}
  .dhead h2{font-size:1.2rem}
  .dgrid .imgwrap{min-height:180px}
  .actions{gap:8px}
  .actions .btn{flex:1 1 100%;width:100%}

  .footer-brand{padding:0 12px 18px;text-align:center;font-size:.74rem}
  .footer-contact{flex-direction:column;align-items:center;gap:5px}
}

@media (max-width:480px){
  .top-in{grid-template-columns:minmax(0,1fr) auto}
  .brand-main{font-size:.94rem}
  .header-actions{gap:5px}
  .lang-switch{max-width:106px}
  .lang-switch select{max-width:74px;text-overflow:ellipsis}
  .who .btn{padding:7px 9px}
  .login,.hero{padding:16px}
  .wrap{padding-left:10px;padding-right:10px}
  .summary{grid-template-columns:1fr;gap:9px}
  .item{gap:8px}
  .item .amt{min-width:70px}
  .chip{font-size:.72rem;padding:2px 7px}
}

@media (max-width:360px){
  .brand-mark{width:34px;height:34px;font-size:.78rem}
  .brand-main{font-size:.88rem}
  .lang-switch{max-width:94px}
  .lang-switch select{max-width:64px;font-size:.76rem}
  .who .btn{min-height:34px;font-size:.82rem;padding:6px 8px}
  .top-in{gap:6px}
  .tab{font-size:.8rem;padding:7px 8px}
}

@media (prefers-reduced-motion:reduce){
  .scan{animation:none;top:50%}
  .fresh .field,.fresh .field.ai input{animation:none}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand-wrap">
    <div class="brand-mark" aria-hidden="true">JN</div>

function t(text){
  return (I18N[CURRENT_LANG] && I18N[CURRENT_LANG][text]) || text;
}
function trDynamic(text){
  let s=text;
  if(CURRENT_LANG==='ca') return s;
  const n1=s.match(/^(\d+) de (\d+)$/); if(n1) return `${n1[1]} of ${n1[2]}`;
  const n2=s.match(/^(\d+) (factura|factures)$/); if(n2){const n=Number(n2[1]); return CURRENT_LANG==='es'?`${n} ${n===1?'factura':'facturas'}`:`${n} ${n===1?'invoice':'invoices'}`;}
  const n3=s.match(/^(\d+) (empresa registrada|empreses registrades)$/); if(n3){const n=Number(n3[1]); return CURRENT_LANG==='es'?`${n} ${n===1?'empresa registrada':'empresas registradas'}`:`${n} ${n===1?'registered company':'registered companies'}`;}
  const p=s.match(/^Pujada el (.+?)( · Sense fitxer original adjunt)?$/); if(p){return CURRENT_LANG==='es'?`Subida el ${p[1]}${p[2]?' · Sin archivo original adjunto':''}`:`Uploaded ${p[1]}${p[2]?' · No original file attached':''}`;}
  const ex=s.match(/^(\d+) factures exportades a Excel$/); if(ex){return CURRENT_LANG==='es'?`${ex[1]} facturas exportadas a Excel`:`${ex[1]} invoices exported to Excel`;}
  const f=s.match(/^Factures$/); if(f) return CURRENT_LANG==='es'?'Facturas':'Invoices';
  return t(s);
}
function applyLanguage(root=document){
  document.documentElement.lang=CURRENT_LANG;
  const select=document.querySelector('#langSelect'); if(select) select.value=CURRENT_LANG;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
    const p=node.parentElement; if(!p || ['SCRIPT','STYLE','NOSCRIPT','TEXTAREA'].includes(p.tagName)) return NodeFilter.FILTER_REJECT;
    if(!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
  for(const node of nodes){
    const raw=node.nodeValue;
    const lead=raw.match(/^\s*/)?.[0]||''; const trail=raw.match(/\s*$/)?.[0]||''; const core=raw.trim();
    const translated=trDynamic(core);
    if(translated!==core) node.nodeValue=lead+translated+trail;
  }
  root.querySelectorAll?.('input[placeholder],select[aria-label],button[title],a[title]').forEach(el=>{
    if(el.placeholder) el.placeholder=trDynamic(el.placeholder);
    if(el.getAttribute('aria-label')) el.setAttribute('aria-label',trDynamic(el.getAttribute('aria-label')));
    if(el.title) el.title=trDynamic(el.title);
  });
}

}

function uploadIsActive(opId){

async function openUpload(file){
  if(!file) return;
  const maxBytes=15*1024*1024;
  if(file.size>maxBytes){
    renderUploadReview(file,'',{currency:'EUR'},'El fitxer supera el límit de 15 MB per a la lectura automàtica. Prova amb un fitxer més petit.',true);
    return;
  }

  const draftId=crypto.randomUUID();
  state.pendingFile={file,src:'',path:'',values:{currency:'EUR'},draftId,tempInvoiceId:null,opId:draftId};
  $('#view').innerHTML=uploadProgressHtml('Preparant el fitxer…','Preparant el PDF o la imatge per pujar-la de manera segura.',10);
  const src=isPdf(file) ? '' : await dataUrlFromFile(file);
  if(!uploadIsActive(draftId)) return;
  const path=`${state.profile.company_id}/_draft/${draftId}-${safeName(file.name)}`;
  state.pendingFile.src=src;
  state.pendingFile.path=path;

  $('#view').innerHTML=uploadProgressHtml('1/2 · Pujant el fitxer…','Desant temporalment l’original a l’emmagatzematge privat de la teva empresa.',35);
  const {error:up}=await withTimeout(
    sb.storage.from('invoices').upload(path,file,{upsert:false}),
    30000,
    'La subida ha tardado más de 30 segundos. Comprueba tu conexión y vuelve a intentarlo.'
  ).catch(error=>({error}));
  if(up){
    if(!uploadIsActive(draftId)) return;
    state.pendingFile=null;
    await renderUploadReview(file,src,{currency:'EUR'},'No s’ha pogut pujar temporalment el fitxer: '+up.message,true);
    return;
  }
  if(!uploadIsActive(draftId)){
    await sb.storage.from('invoices').remove([path]).catch(()=>{});
    return;
  }

  const {data:tmp,error:tmpErr}=await sb.from('invoices').insert({
    company_id:state.profile.company_id,
    status:'pendiente',
    file_path:path,
    file_name:file.name,
    file_type:file.type||null
  }).select('id').single();
  if(tmpErr){
    await sb.storage.from('invoices').remove([path]).catch(()=>{});
    if(uploadIsActive(draftId)){
      state.pendingFile=null;
      await renderUploadReview(file,src,{currency:'EUR'},'No s’ha pogut preparar la factura per a la lectura automàtica: '+tmpErr.message,true);
    }
    return;
  }
  if(!uploadIsActive(draftId)){
    await sb.from('invoices').delete().eq('id',tmp.id).catch(()=>{});
    await sb.storage.from('invoices').remove([path]).catch(()=>{});
    return;
  }
  state.pendingFile.tempInvoiceId=tmp.id;

  try{
    if(!uploadIsActive(draftId)){
      await sb.from('invoices').delete().eq('id',tmp.id).catch(()=>{});
      await sb.storage.from('invoices').remove([path]).catch(()=>{});
      return;
    }
    $('#view').innerHTML=uploadProgressHtml('2/2 · Analitzant amb IA…','La Edge Function està llegint el document i extraient-ne les dades de la factura.',70);
    const data=await extractInvoiceFromStorage(tmp.id);
    if(!uploadIsActive(draftId)){
      await sb.from('invoices').delete().eq('id',tmp.id).catch(()=>{});
      await sb.storage.from('invoices').remove([path]).catch(()=>{});
      return;
    }
    await sb.from('invoices').delete().eq('id',tmp.id);
    if(!uploadIsActive(draftId)) return;
    state.pendingFile.tempInvoiceId=null;
    state.pendingFile.values=data.values;
    const warnings=[...data.warnings];
    if(!data.esFactura){
      warnings.unshift('El document no sembla una factura, tiquet o rebut. Comprova que has seleccionat el fitxer correcte.');
    }
    await renderUploadReview(file,src,state.pendingFile.values,warnings.length?('Lectura automàtica completada amb avisos: '+warnings.join(' · ')):'Lectura automàtica completada. Revisa les dades abans de desar-les.',warnings.length>0);
  }catch(e){
    await sb.from('invoices').delete().eq('id',tmp.id).catch(()=>{});
    await sb.storage.from('invoices').remove([path]).catch(()=>{});
    if(!uploadIsActive(draftId)) return;
    state.pendingFile.tempInvoiceId=null;
    await renderUploadReview(file,src,state.pendingFile.values,'No s’ha pogut completar la lectura automàtica: '+(e.message||'error desconocido')+' Pots tornar enrere i triar «Introduir les dades manualment».',true);
  }
}

  if(mv){await sb.from('invoices').delete().eq('id',ins.id);err.textContent='No s’ha pogut finalitzar el fitxer: '+mv.message;btn.disabled=false;btn.textContent='Desar factura';return}
  const {error:patch}=await sb.from('invoices').update({file_path:finalPath}).eq('id',ins.id);
  if(patch){await sb.storage.from('invoices').remove([finalPath]).catch(()=>{});await sb.from('invoices').delete().eq('id',ins.id);err.textContent='No s’ha pogut guardar la ruta del fitxer: '+patch.message;btn.disabled=false;btn.textContent='Desar factura';return}
  state.pendingFile=null; toast('Factura guardada correctament'); state.view='mine'; await loadData(); renderCompanyShell();
}
async function openDetail(id){
  const inv=state.invoices.find(x=>x.id===id); if(!inv)return; state.current=inv;
  const manager=state.profile.role==='manager', own=manager||inv.company_id===state.profile.company_id;
  const hasFile=!!inv.file_path;
  const preview=hasFile?'Carregant…':'Sense fitxer original adjunt';
  $('#dlgBody').innerHTML=`<div class="dhead"><div><h2>${esc(inv.supplier_name||'Factura')}</h2>${statusChip(inv.status)}</div><button class="btn ghost" data-act="close">Tancar</button></div><div class="dgrid"><div><div class="imgwrap" id="detailPreview">${preview}</div><p class="fname">${esc(inv.file_name||'')}</p></div><div><div id="detailForm" class="fields">${fieldsHTML(inv,own)}</div>${manager?`<div class="fields" style="margin-top:14px"><label class="field"><span>Estat</span><select id="detailStatus"><option value="pendiente" ${inv.status==='pendiente'?'selected':''}>Pendent</option><option value="revisada" ${inv.status==='revisada'?'selected':''}>Revisada</option></select></label><label class="field wide"><span>Nota del gestor</span><textarea id="detailNote">${esc(inv.note||'')}</textarea></label></div>`:(inv.note?`<div class="notice" style="margin-top:14px"><b>Nota del gestor:</b> ${esc(inv.note)}</div>`:'')}<p class="err" id="detailErr"></p><div class="actions">${own?'<button class="btn primary" data-act="saveDetail">Desar canvis</button>':''}${hasFile?'<button class="btn" data-act="download">Descarregar original</button>':''}${own?'<button class="btn danger" data-act="delete">Eliminar</button>':''}</div><p class="meta">Pujada el ${esc(fmtStamp(inv.created_at))}${hasFile?'':' · Sense fitxer original adjunt'}</p></div></div>`;
  $('#dlg').showModal();
  if(!hasFile)return;
  const {data:signed,error}=await sb.storage.from('invoices').createSignedUrl(inv.file_path,300); const p=$('#detailPreview'); if(signed?.signedUrl){if(inv.file_type==='application/pdf'){p.innerHTML=`<iframe src="${esc(signed.signedUrl)}" style="width:100%;height:68vh;border:0" title="PDF"></iframe>`}else p.innerHTML=`<img src="${esc(signed.signedUrl)}" alt="Factura">`}else p.textContent='Vista prèvia no disponible'; if(error) $('#detailErr').textContent=error.message;
}
async function saveDetail(){
  const inv=state.current, err=$('#detailErr'), v=readFields($('#detailForm')); const patch={...v};
  if(state.profile.role==='manager'){patch.status=$('#detailStatus').value;patch.note=$('#detailNote').value.trim()||null}
  const {error}=await sb.from('invoices').update(patch).eq('id',inv.id); if(error){err.textContent=error.message;return} toast('Canvis desats');$('#dlg').close();await loadData();
}
async function deleteCurrent(){
  const inv=state.current; if(!inv)return; if(!confirm('Vols eliminar aquesta factura i el seu fitxer original?'))return;
  if(inv.file_path){const {error:s}=await sb.storage.from('invoices').remove([inv.file_path]); if(s){toast(s.message,true);return}}
  const {error}=await sb.from('invoices').delete().eq('id',inv.id); if(error){toast(error.message,true);return} toast('Factura eliminada');$('#dlg').close();await loadData();
}
async function downloadCurrent(){
  const inv=state.current; if(!inv?.file_path){toast('Aquesta factura no té cap fitxer original adjunt.',true);return} const {data,error}=await sb.storage.from('invoices').createSignedUrl(inv.file_path,60); if(error){toast(error.message,true);return} const a=document.createElement('a');a.href=data.signedUrl;a.download=inv.file_name||'factura';a.target='_blank';a.click();
}
async function loadAllRows(table, pageSize=1000){
  const all=[];
  for(let from=0;;from+=pageSize){
    const to=from+pageSize-1;
    const r=await sb.from(table).select('*').order('created_at',{ascending:false}).range(from,to);
    if(r.error) return {data:[],error:r.error};
    const batch=r.data||[];
    all.push(...batch);
    if(batch.length<pageSize) break;
  }
  return {data:all,error:null};
}
async function loadData(){
  if(!state.user)return;
  if(state.profile.role==='manager'){
    const [companiesResult,invoicesResult]=await Promise.all([
      sb.from('companies').select('*').order('name'),
      loadAllRows('invoices',1000)
    ]);
    if(companiesResult.error){toast(companiesResult.error.message,true);return}
    if(invoicesResult.error){toast(invoicesResult.error.message,true);return}
    state.companies=companiesResult.data||[];
    state.invoices=(invoicesResult.data||[]).map(x=>({...x,currency:normalizeCurrency(x.currency)}));
    if(state.view==='panel')managerView();
  }else{
    const {data,isError}=await fetchCompanyInvoices(); if(isError)return; state.invoices=data||[]; if(state.view==='mine')renderHistory();
  }
}
async function fetchCompanyInvoices(){const r=await sb.from('invoices').select('*').order('created_at',{ascending:false}).limit(500); if(r.error){toast(r.error.message,true);return {data:[],isError:true}} return {data:(r.data||[]).map(x=>({...x,currency:normalizeCurrency(x.currency)})),isError:false}}
async function exportExcel(){
  // L'export del gestor ignora tots els filtres: sempre exporta totes les factures visibles del gestor.
  const list=state.invoices.slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  if(!list.length){toast('No hi ha factures per exportar',true);return}
  const head=['Client','NIF client','Pujada el','Data factura','Emissor','NIF emissor','Núm. factura','Concepte','Base imposable','IVA (%)','Quota IVA','Total','Moneda','Estat','Nota del gestor','Fitxer','ID factura'];
  const rows=list.map(x=>{const c=state.companies.find(c=>c.id===x.company_id);return[c?.name||'',c?.tax_id||'',new Date(x.created_at),x.invoice_date?new Date(x.invoice_date):null,x.supplier_name||'',x.supplier_tax_id||'',x.invoice_number||'',x.concept||'',x.base??null,x.vat_rate??null,x.vat_amount??null,x.total??null,x.currency||'EUR',x.status==='revisada'?'Revisada':'Pendent',x.note||'',x.file_name||'',x.id]});
  const ws=XLSX.utils.aoa_to_sheet([head,...rows],{cellDates:true});
  const last=rows.length+1;
  ws['!cols']=[24,14,19,14,28,16,18,32,16,9,14,14,10,12,34,28,38].map(w=>({wch:w}));
  ws['!autofilter']={ref:`A1:${XLSX.utils.encode_col(head.length-1)}${last}`};
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Factures');

  const byClient=new Map();
  for(const x of list){
    const c=state.companies.find(c=>c.id===x.company_id);
    const key=x.company_id;
    if(!byClient.has(key)) byClient.set(key,{name:c?.name||key,tax:c?.tax_id||'',count:0,base:0,iva:0,total:0,currencies:new Set()});
    const o=byClient.get(key);
    o.count++;
    o.base+=Number(x.base||0);
    o.iva+=Number(x.vat_amount||0);
    o.total+=Number(x.total||0);
    o.currencies.add(x.currency||'EUR');
  }
  const summaryHead=['Client','NIF client','Nº factures','Base imposable','Quota IVA','Total','Monedes'];
  const summaryRows=[...byClient.values()].map(o=>[o.name,o.tax,o.count,Number(o.base.toFixed(2)),Number(o.iva.toFixed(2)),Number(o.total.toFixed(2)),[...o.currencies].join(', ')]);
  const ws2=XLSX.utils.aoa_to_sheet([summaryHead,...summaryRows]);
  ws2['!cols']=[30,16,14,18,16,16,18].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws2,'Resum per client');

  const out=XLSX.write(wb,{bookType:'xlsx',type:'array',cellDates:true});
  const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=`factures_totes_${new Date().toISOString().slice(0,10)}.xlsx`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`${list.length} factures exportades a Excel`);
}
async function login(){
  const email=$('#loginEmail').value.trim(), pass=$('#loginPass').value, err=$('#loginErr'); const {data,error}=await sb.auth.signInWithPassword({email,password:pass}); if(error){err.textContent=error.message;return} state.session=data.session;state.user=data.user;await loadProfile();
}
async function loadProfile(){
  const {data,error}=await sb.from('profiles').select('*').eq('id',state.user.id).single(); if(error){fatal('No s’ha pogut llegir el perfil: '+error.message);return} state.profile=data;renderWho();state.view=data.role==='manager'?'panel':'mine';await loadData(); if(data.role==='manager'){ $('#tabs').hidden=false;$('#tabs').innerHTML='<button class="tab" data-act="tab" data-v="panel" aria-pressed="true">Panel del gestor</button><button class="tab" data-act="tab" data-v="mine" aria-pressed="false">Les meves factures</button>'; managerView(); } else renderCompanyShell();
}
function resetSignedOut(){
  state.session=null;
  state.user=null;
  state.profile=null;
  state.invoices=[];
  state.companies=[];
  state.current=null;
  state.pendingFile=null;
  state.historyFilters={status:'',from:'',to:'',q:''};
  state.view='mine';
  $('#dlg')?.close();
  $('#tabs').hidden=true;
  $('#tabs').innerHTML='';
  renderWho();
  renderLogin();
}

async function logout(){
  if(!sb) return;
  const btn=document.querySelector('[data-act="logout"]');
  if(btn){btn.disabled=true;btn.textContent='Sortint…';}

  const {error}=await sb.auth.signOut();
  if(error){
    if(btn){btn.disabled=false;btn.textContent='Sortir';}
    toast(error.message,true);
    return;
  }

  // No depenem únicament de l'esdeveniment SIGNED_OUT:
  // tanquem la sessió i retornem immediatament a la pantalla d'accés.
  resetSignedOut();
  window.scrollTo({top:0,behavior:'instant'});
}

async function init(){
  sb=getClient(); const {data}=await sb.auth.getSession(); if(data.session){state.session=data.session;state.user=data.session.user;await loadProfile()} else renderLogin();
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){
      resetSignedOut();
    }
  });
}

document.addEventListener('change',e=>{
  if(e.target.id==='langSelect'){ setLanguage(e.target.value); return; }
});

document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]'); if(!el)return; const a=el.dataset.act;
  try{
    if(a==='login') await login();
    else if(a==='logout') await logout();
    else if(a==='pick' || a==='aiMode') $('#filePick').click();
    else if(a==='manualMode') renderManualForm();
    else if(a==='backCapture') renderCompanyShell();
    else if(a==='manualFromAI') renderManualForm();
    else if(a==='saveManual') await saveManual();
    else if(a==='saveUpload') await saveUpload();
    else if(a==='cancelUpload') await cancelPendingUpload();
    else if(a==='open') await openDetail(el.dataset.id);
    else if(a==='close') $('#dlg').close();
    else if(a==='saveDetail') await saveDetail();
    else if(a==='delete') await deleteCurrent();
    else if(a==='download') await downloadCurrent();
    else if(a==='export') exportExcel();
    else if(a==='tab'){state.view=el.dataset.v;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===state.view)));state.view==='panel'?managerView():renderCompanyShell();}
  }catch(ex){toast(ex.message||'Error inesperat',true)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='filePick'){const f=e.target.files?.[0];e.target.value='';if(f)openUpload(f)}
  if(e.target.matches('[data-f]')){state.filters[e.target.dataset.f]=e.target.value;renderManagerTable();}
  if(e.target.matches('[data-hf]')){state.historyFilters[e.target.dataset.hf]=e.target.value;renderHistory();}
});
document.addEventListener('input',e=>{
  if(e.target.matches('[data-f]')){state.filters[e.target.dataset.f]=e.target.value;renderManagerTable();}
  if(e.target.matches('[data-hf]')){state.historyFilters[e.target.dataset.hf]=e.target.value;scheduleHistoryRender();}
});
initLanguage();
init().catch(e=>fatal(e.message||'No s’ha pogut iniciar l’aplicació')).finally(()=>applyLanguage(document));
</script>
</body>
</html>
