<script id="v40-customer-history">
(() => {
  function v40CustomerHistoryRows(docs, selectedMonth='', selectedCategory='') {
    const scoped=(docs||[])
      .filter(doc=>!selectedCategory || normalizeBulkCategory(doc.document_category)===selectedCategory)
      .filter(doc=>!selectedMonth || monthKeyFromDate(doc.created_at)===selectedMonth)
      .sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
    if(!scoped.length) return `<div class="v40-customer-empty">${esc(t('No hi ha documents en aquest període.'))}</div>`;
    const byMonth=new Map();
    for(const doc of scoped){const key=monthKeyFromDate(doc.created_at)||'';if(!byMonth.has(key))byMonth.set(key,[]);byMonth.get(key).push(doc);}
    return [...byMonth.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([key,items])=>`
      <section class="v40-month-group">
        <header class="v40-month-heading"><strong>${esc(monthLabelFromKey(key)||t('Mes no disponible'))}</strong><span>${items.length} ${esc(t('documents'))}</span></header>
        <div class="bulk-list">${items.map(doc=>{
          const category=normalizeBulkCategory(doc.document_category);
          const received=Boolean(doc.received_at);
          const stateClass=received?'is-received':'is-uploaded';
          const sizeMb=((Number(doc.file_size||0)/1024/1024)||0).toFixed(2);
          return `<article class="bulk-row v31-document-row v43-document-row ${stateClass}">
            <div class="v31-document-main">
              <div class="v31-document-title">
                <button type="button" class="bulk-file-open" data-act="bulkOpen" data-bulk-id="${esc(doc.id)}" aria-label="${esc(t('Obrir'))}: ${esc(doc.file_name)}"><b>${esc(doc.file_name)}</b></button>
              </div>
              <small class="bulk-file-meta">${esc(t('Pujat el'))}: ${esc(fmtStamp(doc.created_at))} · ${sizeMb} MB</small>
              ${received&&doc.received_at?`<div class="v31-receipt-date">${esc(t('Recepcionat el'))}: ${esc(fmtStamp(doc.received_at))}</div>`:''}
            </div>
            <div class="v43-document-badges"><span class="v31-state-chip ${stateClass}">${esc(t(received?'Recepcionat correctament':'Pendent de validació'))}</span><span class="bulk-category-pill" data-category="${esc(category)}">${esc(bulkCategoryLabel(category))}</span></div>
            <div class="bulk-row-actions"><button type="button" class="btn ghost" data-act="bulkOpen" data-bulk-id="${esc(doc.id)}">${esc(t('Obrir'))}</button></div>
          </article>`;
        }).join('')}</div>
      </section>`).join('');
  }

  renderBulkMineList = async function(){
    const companyId=state.profile?.company_id;
    if(!companyId) return;
    const docs=await loadBulkDocuments(companyId);
    const box=$('#bulkMineList');
    if(!box) return;
    if(!state.bulkMineFilters) state.bulkMineFilters=Object.create(null);
    const saved=state.bulkMineFilters[companyId]||{};
    const month=saved.month??box.dataset.month??'';
    const category=saved.category??box.dataset.category??'';
    state.bulkMineFilters[companyId]={month,category,status:'',pageCount:''};
    box.dataset.month=month;box.dataset.category=category;box.dataset.status='';box.dataset.pageCount='';
    const scoped=docs.filter(doc=>(!month||monthKeyFromDate(doc.created_at)===month)&&(!category||normalizeBulkCategory(doc.document_category)===category));
    const monthLabel=month?monthLabelFromKey(month):'';
    const countLabel=month?`${t('del mes')} ${monthLabel}`:t('tots els mesos');
    const countText=`${t('Mostrant')} ${scoped.length} ${t('documents').toLowerCase()} · ${countLabel}${category?' · '+bulkCategoryLabel(category):''}`;
    box.innerHTML=`<div class="v40-customer-history">
      <div class="filters bulk-filters v40-customer-filter-row">
        <label class="field"><span>${esc(t('Mes de pujada'))}</span><select id="bulkMineMonth">${bulkMonthOptions(docs,month)}</select></label>
        <label class="field"><span>${esc(t('Classificació del document'))}</span><select id="bulkMineCategory">${bulkCategoryFilterOptions(category)}</select></label>
      </div>
      <p class="v40-customer-count">${esc(countText)}</p>
      <section class="v40-customer-documents">
        <div class="v31-section-heading"><h3>${esc(t('Detall dels documents'))}</h3></div>
        <div class="v40-customer-months">${v40CustomerHistoryRows(docs,month,category)}</div>
      </section>
    </div>`;
    state.bulkDocuments=docs;
    applyLanguage(box);
  };
})();
</script>

<script id="v41-generic-camera-photo-names">
(function(){
  // Some mobile browsers give every newly captured photo the same generic name
  // (for example image.jpg). Rename only generic image names so each capture is
  // distinguishable, while preserving meaningful filenames and duplicate checks.
  const IMAGE_EXTENSIONS = new Set(['jpg','jpeg','png','gif','webp','bmp','tif','tiff','heic','heif','avif']);
  function extensionOf(name){
    const dot=String(name||'').lastIndexOf('.');
    return dot>=0?String(name).slice(dot+1).toLowerCase():'';
  }
  function isImageFile(file){
    return !!file && ((/^image\//i).test(String(file.type||'')) || IMAGE_EXTENSIONS.has(extensionOf(file.name)));
  }
  function isGenericImageName(file){
    if(!isImageFile(file)) return false;
    const name=String(file.name||'');
    const dot=name.lastIndexOf('.');
    const base=(dot>=0?name.slice(0,dot):name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const compact=base.replace(/[^a-z0-9]/g,'');
    // Typical repeated names from camera capture/file-picker providers.
    return /^(?:image|photo|picture|camera|capturedimage|capturedphoto|unknown|unnamed|file|upload|download|blob)\d*$/.test(compact) || compact==='img';
  }
  function photoExtension(file){
    const ext=extensionOf(file.name);
    if(IMAGE_EXTENSIONS.has(ext)) return ext;
    const mime=String(file.type||'').toLowerCase();
    const byMime={'image/jpeg':'jpg','image/png':'png','image/gif':'gif','image/webp':'webp','image/bmp':'bmp','image/tiff':'tiff','image/heic':'heic','image/heif':'heif','image/avif':'avif'};
    return byMime[mime]||'jpg';
  }
  function timestamp(){
    const d=new Date();
    const pad=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  }
  function randomSuffix(){
    try{ if(window.crypto && typeof window.crypto.randomUUID==='function') return window.crypto.randomUUID().slice(0,8); }catch(_){}
    return Math.random().toString(36).slice(2,10).padEnd(8,'0');
  }
  function renamedFile(file){
    const name=`IMG_${timestamp()}_${randomSuffix()}.${photoExtension(file)}`;
    return new File([file], name, {type:file.type||`image/${photoExtension(file)==='jpg'?'jpeg':photoExtension(file)}`, lastModified:file.lastModified||Date.now()});
  }
  document.addEventListener('change', function(event){
    const input=event.target;
    if(!input || input.id!=='bulkPick' || !input.files || !input.files.length) return;
    const files=Array.from(input.files);
    if(!files.some(isGenericImageName)) return;
    try{
      const transfer=new DataTransfer();
      files.forEach(file=>transfer.items.add(isGenericImageName(file)?renamedFile(file):file));
      input.files=transfer.files;
      // The application's existing change handler runs after this capture listener
      // and will display/store the renamed files and use their unique names for dupe checks.
    }catch(_){
      // Keep the original names if the browser does not allow FileList replacement.
      // Normal duplicate checking continues to work in that browser.
    }
  }, true);
})();
</script>
